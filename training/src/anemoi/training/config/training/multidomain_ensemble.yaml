defaults:
  - stretched
  - _self_

method:
  _target_: anemoi.training.train.methods.EnsembleTraining

ensemble_size_per_device: 4

strategy:
  _target_: anemoi.training.distributed.strategy.DDPEnsGroupStrategy
  num_gpus_per_ensemble: ${system.hardware.num_gpus_per_ensemble}

training_loss:
  datasets:
    data:
      _target_: anemoi.training.losses.CRPS
      scalers: ['pressure_level', 'general_variable', 'node_weights', 'time_steps']
      ignore_nans: False
      no_autocast: True
      alpha: 0.95

validation_metrics:
  datasets:
    data:
      crps:
        _target_: anemoi.training.losses.CRPS
        scalers: ['node_weights', 'time_steps']
        ignore_nans: False
        no_autocast: True
        alpha: 1.0
