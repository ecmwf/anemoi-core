# Modifier stages — a list applied in order after a loading strategy, composed
# under training.checkpoint.modifiers. This one adds LoRA adapters with PEFT:
# the loaded weights stay as they are and only the adapters (plus any
# trainable_modules) train. Needs the optional extra: anemoi-training[peft].
#
# Paths are full paths from the LightningModule, as for freezing.yaml:
# `model.model` is the graph model that owns encoder / processor / decoder.
# target_modules is "all-linear", a list of exact paths, or a regex matched in
# full against full paths (it selects the Linear layers among its matches).
#
# Checkpoints record the adapters, so any later load or resume rebuilds them
# without this config. Inference checkpoints hold merged weights and load
# without peft.
- _target_: anemoi.training.checkpoint.modifiers.peft.PeftModifierStage
  peft_config:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.0             # must stay 0 when system.hardware.num_gpus_per_model > 1
    target_modules: all-linear    # e.g. 'model\.model\.processor\..*' or ["model.model.processor.proc.0.lin_query"]
  trainable_modules: []           # e.g. ["model.model.decoder.0"] to keep training next to the adapters
