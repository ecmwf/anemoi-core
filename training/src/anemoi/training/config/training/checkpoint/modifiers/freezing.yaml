# Modifiers, applied in order after loading. This one freezes submodules.
# Paths are dot paths from the LightningModule. The graph model is at model.model.
# Encoder and decoder keys are the names in model.model.encoder / model.model.decoder
# (e.g. "0", or "global" / "regional").
- _target_: anemoi.training.checkpoint.modifiers.freezing.FreezingModifierStage
  submodules_to_freeze: []      # e.g. ["model.model.encoder.0", "model.model.processor"]
  strict: false                 # raise if a named submodule is not found
