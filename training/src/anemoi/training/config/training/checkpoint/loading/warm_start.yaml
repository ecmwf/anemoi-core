# Resume a run. Lightning loads the weights, optimizer, scheduler and progress.
# No loading strategy gives the same result.
# The model must match the checkpoint exactly. For a changed model, use
# weights_only (skip_mismatched: true) or transfer_learning.
_target_: anemoi.training.checkpoint.loading.strategies.WarmStartLoader
