---
# Transport training of the spatial downscaler. Loss and metrics are on hres, the dataset the model
# predicts; lres is an input only. The entry config adds training.transport.training_condition.
defaults:
  - optimization: default
  - weight_averaging: null
  # Opt-in checkpoint pipeline (training.checkpoint). Default null = fresh run.
  - optional checkpoint/source: null
  - optional checkpoint/loading: null
  - optional checkpoint/modifiers: null
  - transport_settings
  - _self_

# base seed of all random number generators. null takes the seed of the checkpoint the run
# continues from, or draws a new one for a new run
seed: null

check_variables_compatibility:
  ignore_units: False
  ignore_processing_period: False

allow_variable_subset: False

# run in deterministic mode ; slows down
deterministic: False

# gradient accumulation across K batches, K >= 1 (if K == 1 then no accumulation)
accum_grad_batches: 1

num_sanity_val_steps: 6

strategy:
  _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
  num_gpus_per_model: ${system.hardware.num_gpus_per_model}
  read_group_size: ${dataloader.read_group_size}
  use_local_synchronization: True
  broadcast_buffers: False
  static_graph: False
  find_unused_parameters: True

# dynamic rescaling of the loss gradient, see https://arxiv.org/pdf/2306.06079.pdf, section 4.3.2
loss_gradient_scaling: False

# Set max_epochs or max_steps. Training stops at the first limit reached.
max_epochs: null

scalers:
  datasets:
    hres:
      general_variable:
        _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
        weights:
          default: 1
          2t: 2
          10u: 0.1
          10v: 0.1
          tp: 0.025
      node_weights:
        _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
        nodes_attribute_name: area_weight
        norm: unit-sum
      time_steps:
        _target_: anemoi.training.losses.scalers.UniformTimeStepScaler

training_loss:
  datasets:
    hres:
      _target_: anemoi.training.losses.MSELoss
      scalers: ['general_variable', 'node_weights', 'time_steps']
      ignore_nans: True

validation_metrics:
  datasets:
    hres:
      mse:
        _target_: anemoi.training.losses.MSELoss
        scalers: ['node_weights', 'time_steps']
        ignore_nans: True

variable_groups:
  datasets:
    hres:
      default: sfc

metrics:
  datasets:
    hres:
    - 2t
    - 10u
    - 10v
    - tp
