# The transport model of graphtransformer_multi_transport.yaml, learning tendencies from the latest input state.
defaults:
- graphtransformer_multi_transport
- _self_

condition_on_residual: False

model:
  _target_: anemoi.models.models.AnemoiTransportTendModelEncProcDec

# The tendency is added back to the latest input state.
residual:
  datasets:
    era5:
      _target_: anemoi.models.layers.residual.SkipConnection # options: SkipConnection, TruncatedConnection
      step: -1 # use the latest step as skip connection
    cerra:
      _target_: anemoi.models.layers.residual.SkipConnection # options: SkipConnection, TruncatedConnection
      step: -1 # use the latest step as skip connection
