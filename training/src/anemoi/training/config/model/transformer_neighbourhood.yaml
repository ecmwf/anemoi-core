num_channels: 1024
cpu_offload: False

keep_batch_sharded: True

model:
  _target_: anemoi.models.models.AnemoiModelEncProcDec
  hidden_nodes_name: "hidden"
  latent_skip: True

layer_kernels:
  # The layer_kernels can be adjusted per model component, but are defined here for convenience.
  LayerNorm:
    _target_: torch.nn.LayerNorm
  Linear:
    _target_: torch.nn.Linear
  Activation:
    _target_: torch.nn.GELU
  QueryNorm:
    _target_: anemoi.models.layers.normalization.AutocastLayerNorm
    bias: False
  KeyNorm:
    _target_: anemoi.models.layers.normalization.AutocastLayerNorm
    bias: False

# Neighbourhood attention: every query attends only to the nodes around it on a global grid.
# The encoder, processor and decoder name the grid family of their nodes, which selects the
# attention kernels (see GRID_KERNELS in anemoi.models.layers.neighbourhood_attention):
#   octahedral  octahedral reduced Gaussian grids, e.g. O96 data with O48 hidden nodes
#   healpix     HEALPix grids, in ring or nested ordering; HEALPixNodes come in nested order,
#               which every layer reorders to rows and back
# The node coordinates of the graph fix the resolution and the order of the points, so the
# hidden nodes must lie on a grid of the same family, e.g. graph=encoder_decoder_only with
# hidden nodes from ReducedGaussianGridNodes (grid: o48).
# kernel_size is [latitude rows, points per row], both odd. backend is "triton" (GPU),
# "flex" or "sdpa" (dense mask, small grids only).

processor:
  _target_: anemoi.models.layers.processor.TransformerProcessor
  num_layers: 16
  num_chunks: 4
  mlp_hidden_ratio: 4 # GraphTransformer/Transformer only; use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
  mlp_implementation: mlp
  num_heads: 16 # GraphTransformer or Transformer only
  window_size: null
  dropout_p: 0.0
  attention_implementation: neighbourhood
  neighbourhood:
    grid: octahedral
    kernel_size: [7, 13]
    backend: triton
  qk_norm: False # Transformer and GraphTransformer only
  softcap: 0.0 # Transformer only
  cpu_offload: ${model.cpu_offload}
  gradient_checkpointing: True
  layer_kernels: ${model.layer_kernels}
  rotary_embeddings: # rotary position embeddings from the positions of the nodes on the sphere; null switches them off
    max_frequency: 100 # shortest wavelength ~ 40,000 km / max_frequency = 400 km
    backend: triton # triton (GPU kernel) or torch (PyTorch, any device)

encoder:
  _target_: anemoi.models.layers.mapper.TransformerForwardMapper
  num_chunks: 1
  mlp_hidden_ratio: 4 # use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
  mlp_implementation: mlp
  num_heads: 16
  window_size: null
  dropout_p: 0.0
  attention_implementation: neighbourhood
  neighbourhood:
    grid: octahedral
    kernel_size: [5, 5] # hidden node rows attend to key rows of the finer data grid
    backend: triton
  softcap: 0.0
  qk_norm: False
  cpu_offload: ${model.cpu_offload}
  gradient_checkpointing: True
  layer_kernels: ${model.layer_kernels}
  shard_strategy: "edges"
  rotary_embeddings: # rotary position embeddings from the positions of the nodes on the sphere; null switches them off
    max_frequency: 100 # shortest wavelength ~ 40,000 km / max_frequency = 400 km
    backend: triton # triton (GPU kernel) or torch (PyTorch, any device)

decoder:
  _target_: anemoi.models.layers.mapper.TransformerBackwardMapper
  num_chunks: 1
  mlp_hidden_ratio: 4 # use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
  mlp_implementation: mlp
  num_heads: 16
  window_size: null
  dropout_p: 0.0
  attention_implementation: neighbourhood
  neighbourhood:
    grid: octahedral
    kernel_size: [3, 5]
    backend: triton
  softcap: 0.0
  qk_norm: False
  cpu_offload: ${model.cpu_offload}
  gradient_checkpointing: True
  layer_kernels: ${model.layer_kernels}
  shard_strategy: "edges"
  rotary_embeddings: # rotary position embeddings from the positions of the nodes on the sphere; null switches them off
    max_frequency: 100 # shortest wavelength ~ 40,000 km / max_frequency = 400 km
    backend: triton # triton (GPU kernel) or torch (PyTorch, any device)

residual:
  _target_: anemoi.models.layers.residual.SkipConnection # options: SkipConnection, TruncatedConnection
  step: -1 # use the latest step as skip connection

output_mask:
  _target_: anemoi.training.utils.masks.NoOutputMask

trainable_parameters:
  data: 8
  hidden: 8
  data2hidden: 8
  hidden2data: 8

attributes:
  edges: []
  nodes: []

node_loss_weight: area_weight

# Bounding configuration
bounding: #These are applied in order
  # Bound tp (total precipitation) with a Relu bounding layer
  # ensuring a range of [0, infinity) to avoid negative precipitation values.
  - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
    variables:
      - tp
