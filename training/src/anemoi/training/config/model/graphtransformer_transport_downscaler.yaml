# Transport model of the spatial downscaler: predicts hres from lres (projected onto the hres grid) and the
# hres forcings, encoded together by one joint encoder.
num_channels: 1024
cpu_offload: False

keep_batch_sharded: True

model:
  _target_: anemoi.models.models.AnemoiTransportTendModelEncProcDec
  hidden_nodes_name: "hidden"
  latent_skip: True
  transport:
    # The entry config sets the objective and its sampling defaults (inference_defaults).
    sigma_data: 1.0
    noise_channels: 32
    noise_cond_dim: 16
    noise_embedder:
      _target_: anemoi.models.layers.diffusion.SinusoidalEmbeddings
      num_channels: ${model.model.transport.noise_channels}
      max_period: 1000

layer_kernels:
  # The layer_kernels can be adjusted per model component, but are defined here for convenience.
  LayerNorm:
    _target_: anemoi.models.layers.normalization.ConditionalLayerNorm
    normalized_shape: ${model.num_channels}
    condition_shape: ${model.model.transport.noise_cond_dim}
    zero_init: True
    autocast: false
  Linear:
    _target_: torch.nn.Linear
  Activation:
    _target_: torch.nn.GELU
  QueryNorm:
    _target_: anemoi.models.layers.normalization.AutocastLayerNorm
    bias: False
  KeyNorm:
    _target_: anemoi.models.layers.normalization.AutocastLayerNorm
    bias: False

processor:
  _target_: anemoi.models.layers.processor.GraphTransformerProcessor
  num_channels: ${model.num_channels}
  trainable_size: ${model.edge_trainable_parameters.hidden2hidden}
  sub_graph_edge_attributes: ${model.attributes.edges}
  num_layers: 16
  num_chunks: 4
  mlp_hidden_ratio: 4 # GraphTransformer/Transformer only; use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
  mlp_implementation: mlp
  num_heads: 16 # GraphTransformer or Transformer only
  qk_norm: True
  cpu_offload: ${model.cpu_offload}
  gradient_checkpointing: True
  layer_kernels: ${model.layer_kernels}
  shard_strategy: "edges"
  graph_attention_backend: "triton"  # Options: "triton", "pyg"

encoders:
  inputs: # user-defined key. It will appear in the state-dict
    # lres (projected onto the hres grid) and hres sit on the same nodes, so their inputs are joined node by
    # node and encoded in one pass with the lres -> hidden edges.
    source_datasets: [ "lres", "hres" ]
    dataset_fusing_strategy:  "joint" # Options: "none" (one source dataset per batch), "sequential" (needs a projecting node embedder), "joint" (source datasets on the same grid nodes, joined node by node)
    node_embedder: # NoOpNodeEmbedder (pass-through) for "none" and "joint"; "sequential" needs a projecting one, e.g. {_target_: anemoi.models.layers.node_embedder.LinearNodeEmbedder, num_channels: 512}
      _target_: anemoi.models.layers.node_embedder.NoOpNodeEmbedder
    mapper:
      _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
      num_channels: ${model.num_channels}
      trainable_size: ${model.edge_trainable_parameters.data2hidden}
      sub_graph_edge_attributes: ${model.attributes.edges}
      num_chunks: 4
      mlp_hidden_ratio: 4 # GraphTransformer/Transformer only; use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
      mlp_implementation: mlp
      num_heads: 16 # GraphTransformer or Transformer only
      qk_norm: False
      cpu_offload: ${model.cpu_offload}
      gradient_checkpointing: True
      layer_kernels: ${model.layer_kernels}
      shard_strategy: "edges"
      graph_attention_backend: "triton"  # Options: "triton", "pyg"
      edge_pre_mlp: False

latent_aggregator:
  _target_: anemoi.models.layers.aggregator.SumAggregator

decoders:
  hres: # user-defined key. It will appear in the state-dict
    target_datasets: [ "hres" ]
    target_node_features: [ "encoded_data" ] # options: coordinates, forcings, prognostics, trainable_parameters, encoded_data
    mapper:
      _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
      num_channels: ${model.num_channels}
      trainable_size: ${model.edge_trainable_parameters.hidden2data}
      sub_graph_edge_attributes: ${model.attributes.edges}
      num_chunks: 4
      mlp_hidden_ratio: 4 # GraphTransformer/Transformer only; use 4 (mlp) or ~2.67 (glu/swiglu/geglu/reglu)
      mlp_implementation: mlp
      num_heads: 16 # GraphTransformer or Transformer only
      initialise_data_extractor_zero: False
      qk_norm: False
      cpu_offload: ${model.cpu_offload}
      gradient_checkpointing: True
      layer_kernels: ${model.layer_kernels}
      shard_strategy: "edges"
      graph_attention_backend: "triton"  # Options: "triton", "pyg"
      edge_pre_mlp: False

condition_on_residual: False

# The hres outputs that lres has under the same name are learned as tendencies against lres: hres - lres.
tendency_reference:
  hres: lres

# Outputs learned directly as states instead of tendencies against lres.
state_variables:
  hres: [tp]

# The reference is built by lres's own residual connection. With several snapshots (task.offsets),
# output step i is taken against lres input step i.
residual:
  datasets:
    lres:
      _target_: anemoi.models.layers.residual.SkipConnection
      step: matching

output_mask:
  datasets:
    hres:
      _target_: anemoi.training.utils.masks.NoOutputMask

node_trainable_parameters:
  lres: 8
  hres: 8
  hidden: 8

edge_trainable_parameters:
  data2hidden: 8
  hidden2hidden: 8
  hidden2data: 8

attributes:
  edges:
  - edge_length
  - edge_dirs
  nodes: []

# Torch compile configuration
# A list of modules present in the model, which will be compiled
# You can optionally pass options to torch.compile with the 'options' key
#
# Below is an explanation of some common parameters to torch.compile
# For a full list of possible parameters, consult the documenation for torch compile
#       https://docs.pytorch.org/docs/stable/generated/torch.compile.html
#
# dynamic (bool): When True, it will try to avoid recompilation by generating
#       as general a kernel as possible. But the performance of the general
#       kernel might be worse. When False, it will generate a specific
#       kernel for each input shape (until the configurable recompile
#       limit has been hit), leading to possibly better performance but
#       more recompilations
# mode (str): Different compilation modes, allowing you to trade off
#       compilation time versus potential performance. See the
#       torch.compile documentation for list of possible modes
# fullgraph (bool): When True, torch.compile will error when it hits a
#       section of code it can't compile. When False, it will fallback to
#       non-compiled ("eager") execution for those lines.
# options (dict): a dict of further options which can be passed to torch.compile
# Nothing is compiled for now: compiled modules inside the activation-checkpointed mappers raise a
# CheckpointError on torch 2.9 and 2.10.
compile: []

# Bounding configuration
bounding:
  datasets:
    hres: []
