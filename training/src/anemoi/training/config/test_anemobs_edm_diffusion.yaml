# Anemobs test config for the EDM diffusion transport model
# (AnemoiTransportModelEncProcDec, TransportTraining). Derived from test_anemobs_ens_afcrps.yaml: same data,
# single hidden mesh and GraphTransformer model. Two datasets, both encoded and decoded: ERA5 (`era`) and
# conventional surface observations (`combined_surface`, without `reportype`). State prediction with the
# `edm_diffusion` objective; inference samples with Heun, 50 steps.
#   anemoi-training train --config-name=test_anemobs_edm_diffusion
data:
  format: zarr
  frequency: 12h
  datasets:
    era:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - insolation
      - lsm
      - sdor
      - slor
      - z
      diagnostic:
      - tp
      - cp
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: [tp]
            min-max: null
            max: [sdor, slor, z]
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - insolation
            - lsm
    combined_surface:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - stalt
      - lsm
      - cos_sza
      diagnostic: []
      processors:
        const_imputer:
          _target_: anemoi.models.preprocessing.imputer.InputImputer
          config:
            default: mean
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max: null
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - lsm
            - cos_sza
  num_features: null
dataloader:
  prefetch_factor: 2
  pin_memory: true
  read_group_size: ${system.hardware.num_gpus_per_model}
  num_workers:
    training: 4
    validation: 4
    test: 4
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: 20
    validation: 10
    test: 20
  training:
    datasets:
      era:
        dataset_config:
          dataset: ${system.input.era}
          frequency: ${data.frequency}
          drop: [cdww, 100u, 100v, h1012, h1214, h1417, h1721, h2125, h2530, hcc, lcc, mcc, wmb, sin_mwd, cos_mwd, mwp, snowc, ssrd, stl1, stl2, strd, swh, swvl1, swvl2, ro, sd]
        start: 1979
        end: 2023
        trajectory: null
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          - reportype
          window: (-12h,0]
        start: 2008
        end: 2023
        trajectory: null
  validation:
    datasets:
      era:
        dataset_config:
          dataset: ${system.input.era}
          frequency: ${data.frequency}
          drop: [cdww, 100u, 100v, h1012, h1214, h1417, h1721, h2125, h2530, hcc, lcc, mcc, wmb, sin_mwd, cos_mwd, mwp, snowc, ssrd, stl1, stl2, strd, swh, swvl1, swvl2, ro, sd]
        start: 2024
        end: 2024
        trajectory: null
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          - reportype
          window: (-12h,0]
        start: 2024
        end: 2024
        trajectory: null
  test:
    datasets:
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          - reportype
          window: (-12h,0]
        start: 2025
        end: 2025
        trajectory: null
diagnostics:
  callbacks: []
  plot:
    settings:
      asynchronous: true
      datashader: true
      projection_kind: equirectangular
      precip_and_related_fields: [tp, cp]
      colormaps:
        default:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: viridis
        error:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: bwr
        precip:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormapClevels
          clevels:
          - '#ffffff'
          - '#04e9e7'
          - '#019ff4'
          - '#0300f4'
          - '#02fd02'
          - '#01c501'
          - '#008e00'
          - '#fdf802'
          - '#e5bc00'
          - '#fd9500'
          - '#fd0000'
          - '#d40000'
          - '#bc0000'
          - '#f800fd'
          variables: ${diagnostics.plot.settings.precip_and_related_fields}
    frequency:
      batch: 5
      epoch: 1
    parameters: []
    sample_idx: 0
    datasets_to_plot: []
    focus_areas: {}
    callbacks:
    - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
        # group parameters by categories when visualizing contributions to the loss
      dataset_names: ["era", "combined_surface"]
      parameter_groups: {}
      every_n_batches: ${diagnostics.plot.frequency.batch}
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.loss.loss_plot_fn
        _partial_: true
    - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
      tag_infix: ens
      dataset_names: ["era"]
      sample_idx: ${diagnostics.plot.sample_idx}
      parameters:
      - z_500
      - tp
      - 2t
      - 10u
      - 10v
      every_n_batches: ${diagnostics.plot.frequency.batch}
      members: null
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.ensemble_plot_fn
        _partial_: true
        accumulation_levels_plot: [0, 0.05, 0.1, 0.25, 0.5, 1, 1.5, 2, 3, 4, 5, 6, 7, 100]
    - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
      tag_infix: ens
      dataset_names: ["combined_surface"]
      sample_idx: ${diagnostics.plot.sample_idx}
      parameters:
      - obsvalue_t2m_0
      - obsvalue_u10m_0
      - obsvalue_v10m_0
      - obsvalue_ps_0
      - obsvalue_pmsl_0
      every_n_batches: ${diagnostics.plot.frequency.batch}
      members: null
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.ensemble_plot_fn
        _partial_: true
        accumulation_levels_plot: [0, 0.05, 0.1, 0.25, 0.5, 1, 1.5, 2, 3, 4, 5, 6, 7, 100]
  benchmark_profiler:
    memory:
      enabled: true
      steps: 5
      warmup: 20
      extra_plots: false
      trace_rank0_only: false
    time:
      enabled: false
      verbose: false
    speed:
      enabled: true
    system:
      enabled: false
    model_summary:
      enabled: false
    snapshot:
      enabled: false
      steps: 4
      warmup: 0
  log:
    mlflow:
      enabled: true
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      offline: true
      authentication: true
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: anemobs
      project_name: AIFS
      system: false
      terminal: true
      run_name: 'test-anemobs-edm-diffusion'
      prefix: ''
      log_hyperparams: true
      on_resume_create_child: true
      expand_hyperparams:
      - config
      http_max_retries: 35
      max_params_length: 5000
      save_dir: ${system.output.logs.mlflow}
      log_model: false
    interval: 100
    wandb:
      enabled: false
      entity: null
  debug:
    anomaly_detection: false
  enable_checkpointing: true
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: -1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  enable_progress_bar: true
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 1
  check_val_every_n_epoch: 1
  print_memory_summary: false
system:
  output:
    root: ${oc.env:SCRATCH}/anemobs-test/edm_diffusion/
    logs:
      root: logs
      wandb: wandb
      mlflow: mlflow
      tensorboard: tensorboard
    checkpoints:
      root: checkpoint
      every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
      every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
      every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
    plots: plots
    profiler: profiler
  input:
    era: aifs-ea-an-oper-0001-mars-o96-1979-2024-6h-v1-for-single-v2
    combined_surface: dop-ea-ofb-0001-1979-2025-v2-combined-surface-observations
    loss_matrices_path: null
    truncation: null
    truncation_inv: null
    warm_start: null
  hardware:
    accelerator: auto
    num_gpus_per_node: ${oc.decode:${oc.env:SLURM_GPUS_PER_NODE,1}}
    num_nodes: ${oc.decode:${oc.env:SLURM_NNODES,1}}
    num_gpus_per_model: 1
graph:
  overwrite: true
  nodes:
    era:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.era.dataset_config}
      attributes: ${graph.attributes.nodes}
    combined_surface:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.combined_surface.dataset_config}
      attributes: {}
    hidden:
      node_builder:
        _target_: anemoi.graphs.nodes.TriNodes
        resolution: 5
  edges:
  - source_name: era
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.CutOffEdges
      cutoff_factor: 0.7
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: combined_surface
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.ReversedKNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: hidden
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.MultiScaleEdges
      x_hops: 1
      scale_resolutions: ${graph.nodes.hidden.node_builder.resolution}
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: hidden
    target_name: era
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: hidden
    target_name: combined_surface
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  attributes:
    nodes:
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
        norm: unit-max
        fill_value: 0
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-std
      edge_dirs:
        _target_: anemoi.graphs.edges.attributes.EdgeDirection
        norm: unit-std
      # add 2*order extra features, to test
      dir_harmonics:
        _target_: anemoi.graphs.edges.attributes.DirectionalHarmonics
        order: 3
  post_processors: []
model:
  cpu_offload: false
  keep_batch_sharded: false
  model:
    _target_: anemoi.models.models.AnemoiTransportModelEncProcDec
    hidden_nodes_name: hidden
    latent_skip: true
    transport:
      objective: edm_diffusion
      sigma_data: 1.0
      noise_channels: 32
      noise_cond_dim: 16
      sigma_max: 100.0
      sigma_min: 0.02
      rho: 7.0
      noise_embedder:
        _target_: anemoi.models.layers.diffusion.SinusoidalEmbeddings
        num_channels: ${model.model.transport.noise_channels}
        max_period: 1000
      training_condition:
        distribution: karras
        sigma_max: ${model.model.transport.sigma_max}
        sigma_min: ${model.model.transport.sigma_min}
        rho: ${model.model.transport.rho}
      inference_defaults:
        sampling_schedule:
          schedule_type: karras
          sigma_max: 100.0
          sigma_min: 0.02
          rho: 7.0
          num_steps: 50
        sampler:
          sampler: heun
  # The noise level (EDM) or bridge time (SI) conditions every layer norm: encoders, processor, decoders.
  layer_kernels:
    LayerNorm:
      _target_: anemoi.models.layers.normalization.ConditionalLayerNorm
      normalized_shape: ${model.processor.num_channels}
      condition_shape: ${model.model.transport.noise_cond_dim}
      zero_init: true
      autocast: false
    Linear:
      _target_: torch.nn.Linear
    Activation:
      _target_: torch.nn.GELU
    QueryNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
    KeyNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
  processor:
    _target_: anemoi.models.layers.processor.GraphTransformerProcessor
    num_channels: 768
    trainable_size: 8
    sub_graph_edge_attributes: ["edge_length", "edge_dirs", "dir_harmonics"]
    num_layers: 16
    num_chunks: 4
    mlp_hidden_ratio: 4
    num_heads: 16
    qk_norm: false
    cpu_offload: ${model.cpu_offload}
    gradient_checkpointing: true
    layer_kernels: ${model.layer_kernels}
    graph_attention_backend: triton
    edge_pre_mlp: false
  obs_encoder:
    _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
    num_channels: 768
    trainable_size: 0
    sub_graph_edge_attributes: ["edge_length", "edge_dirs", "dir_harmonics"]
    num_chunks: 4
    mlp_hidden_ratio: 4
    num_heads: 16
    qk_norm: false
    cpu_offload: ${model.cpu_offload}
    gradient_checkpointing: true
    layer_kernels: ${model.layer_kernels}
    shard_strategy: edges
    graph_attention_backend: triton
    edge_pre_mlp: false
  encoders:
    analysis:
      source_datasets: ["era"]
      dataset_fusing_strategy: "none"
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
        num_channels: 768
        trainable_size: 8
        sub_graph_edge_attributes: ["edge_length", "edge_dirs", "dir_harmonics"]
        num_chunks: 4
        mlp_hidden_ratio: 4
        num_heads: 16
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
    # Observations: combined_surface, also decoded (see decoders)
    combined_surface:
      source_datasets: [combined_surface]
      dataset_fusing_strategy: none
      mapper: ${model.obs_encoder}
  latent_aggregator:
    _target_: anemoi.models.layers.aggregator.SumAggregator
  decoders:
    analysis:
      target_datasets: ["era"]
      target_node_features: ["encoded_data"]
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: 768
        trainable_size: 8
        sub_graph_edge_attributes: ["edge_length", "edge_dirs", "dir_harmonics"]
        num_chunks: 4
        mlp_hidden_ratio: 4
        num_heads: 16
        initialise_data_extractor_zero: false
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
    combined_surface:
      target_datasets: ["combined_surface"]
      target_node_features: ["coordinates", "target_forcings"]
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: 768
        trainable_size: 0
        sub_graph_edge_attributes: ["edge_length", "edge_dirs", "dir_harmonics"]
        num_chunks: 4
        mlp_hidden_ratio: 4
        num_heads: 16
        initialise_data_extractor_zero: false
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
  # Transport models take no bounding.
  bounding:
    datasets:
      era: []
      combined_surface: []
  residual:
    datasets:
      era:
        _target_: anemoi.models.layers.residual.SkipConnection
        step: -1
  output_mask:
    datasets:
      era:
        _target_: anemoi.training.utils.masks.NoOutputMask
      combined_surface:
        _target_: anemoi.training.utils.masks.NoOutputMask
  compile: []
  node_trainable_parameters:
    era: 8
    combined_surface: 0
    hidden: 8
  # - module: anemoi.models.layers.conv.GraphTransformerConv
task:
  _target_: anemoi.training.tasks.Forecaster
  multistep_input: 1
  multistep_output: 1
  timestep: 12H
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1
  validation_rollout: 1
training:
  scalers:
    datasets:
      era:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            q: 0.8
            t: 6
            u: 0.8
            v: 0.5
            w: 0.001
            z: 12
            sp: 10
            10u: 0.1
            10v: 0.1
            2d: 0.5
            tp: 0.025
            cp: 0.0025
        pressure_level:
          _target_: anemoi.training.losses.scalers.ReluVariableLevelScaler
          group: pl
          y_intercept: 0.2
          slope: 0.001
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_attribute_name: area_weight
          norm: unit-sum
      combined_surface:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
  optimization:
    optimizer:
      _target_: torch.optim.AdamW
      betas: [0.9, 0.95]
      weight_decay: 0.1
    lr_scheduler:
      _target_: timm.scheduler.CosineLRScheduler
      lr_min: 3.0e-07
      t_initial: ${training.max_steps}
      warmup_t: 1000
      t_in_epochs: false
    lr: 6.25e-05
    pl_lr_scheduler:
      interval: step
  run_id: null
  fork_run_id: null
  transfer_learning: false
  load_weights_only: false
  update_ds_stats_on_ckpt_load:
    states: false
    tendencies: true
  deterministic: false
  precision: bf16-mixed
  accum_grad_batches: 1
  num_sanity_val_steps: 0
  gradient_clip:
    val: 1.0
    algorithm: norm
  method:
    _target_: anemoi.training.train.methods.TransportTraining
  transport:
    prediction_mode: state
    objective: edm_diffusion
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}
    use_local_synchronization: true
    broadcast_buffers: false
  loss_gradient_scaling: false
  max_epochs: 100
  max_steps: 75000
  submodules_to_freeze: []
  # EDM-weighted MSE (noise-level loss weights).
  training_loss:
    datasets:
      era:
        _target_: anemoi.training.losses.WeightedMSELoss
        scalers: ["general_variable", "pressure_level", "node_weights"]
        ignore_nans: true
      combined_surface:
        _target_: anemoi.training.losses.WeightedMSELoss
        scalers: ["general_variable"]
        ignore_nans: true
  validation_metrics:
    datasets:
      era:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: ["node_weights"]
          ignore_nans: true
      combined_surface:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: []
          ignore_nans: true
  variable_groups:
    datasets:
      era:
        default: sfc
        pl:
          param:
          - q
          - t
          - u
          - v
          - w
        sfc:
          param:
          - tp
          - cp
          - 10u
          - 10v
          - 2d
          - sp
      combined_surface:
        default: sfc
  metrics:
    datasets:
      era:
      - z_500
      - z_1000
      - t_500
      - u_850
      - v_850
      combined_surface:
      - obsvalue_t2m_0
      - obsvalue_u10m_0
      - obsvalue_v10m_0
      - obsvalue_ps_0
      - obsvalue_pmsl_0
config_validation: false
