# Single-GPU anemobs test config for a limited-area model (LAM).
#
# Gridded dataset `lam`: CERRA (5.5 km, thinned to every 10th point, ~55 km) cut out of ERA5 o96.
# The ERA5 points within 300 km of the CERRA domain form the lateral boundary; the output mask
# (graph attribute `cutout_mask`) restricts the loss to the CERRA domain and, in rollout, refills
# the boundary with the true state.
# Observation dataset `combined_surface`: conventional surface observations, used as encoder
# input only. Tabular datasets cannot be cropped to an area yet, so the observations stay
# global; the obs->hidden edges use a 150 km cut-off, so observations far from the domain get
# no edges. There is no observation decoder: a loss on global observations would be dominated
# by points outside the domain.
#
#   anemoi-training train --config-name=test_anemobs_lam
data:
  format: zarr
  frequency: 6h
  datasets:
    lam:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - insolation
      - lsm
      - z
      diagnostic: []
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max: [z]
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - insolation
            - lsm
    combined_surface:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - reportype
      - stalt
      - lsm
      - cos_sza
      diagnostic: []
      processors:
        const_imputer:
          _target_: anemoi.models.preprocessing.imputer.InputImputer
          config:
            default: mean
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max: null
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - lsm
            - cos_sza
  num_features: null
dataloader:
  prefetch_factor: 2
  pin_memory: true
  read_group_size: ${system.hardware.num_gpus_per_model}
  num_workers:
    training: 4
    validation: 4
    test: 4
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: 20
    validation: 10
    test: 20
  # The LAM dataset: CERRA cut out of ERA5. Both are restricted to the same variables, because
  # soil and 100 m wind fields have incompatible level metadata between the two.
  dataset:
    cutout:
    - dataset: ${system.input.lam}
      thinning: 10
      select: &lam_variables
      - 10u
      - 10v
      - 2d
      - 2t
      - msl
      - sp
      - skt
      - tcc
      - lsm
      - z
      - insolation
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - q_50
      - q_100
      - q_150
      - q_200
      - q_250
      - q_300
      - q_400
      - q_500
      - q_600
      - q_700
      - q_850
      - q_925
      - q_1000
      - t_50
      - t_100
      - t_150
      - t_200
      - t_250
      - t_300
      - t_400
      - t_500
      - t_600
      - t_700
      - t_850
      - t_925
      - t_1000
      - u_50
      - u_100
      - u_150
      - u_200
      - u_250
      - u_300
      - u_400
      - u_500
      - u_600
      - u_700
      - u_850
      - u_925
      - u_1000
      - v_50
      - v_100
      - v_150
      - v_200
      - v_250
      - v_300
      - v_400
      - v_500
      - v_600
      - v_700
      - v_850
      - v_925
      - v_1000
      - z_50
      - z_100
      - z_150
      - z_200
      - z_250
      - z_300
      - z_400
      - z_500
      - z_600
      - z_700
      - z_850
      - z_925
      - z_1000
    - dataset: ${system.input.forcing_dataset}
      select: *lam_variables
    adjust: all
    min_distance_km: 0
    max_distance_km: 300
  training:
    datasets:
      lam:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 2010
        end: 2019
        trajectory: null
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          window: (-6h,0]
        start: 2010
        end: 2019
        trajectory: null
  validation:
    datasets:
      lam:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 2020
        end: 2020
        trajectory: null
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          window: (-6h,0]
        start: 2020
        end: 2020
        trajectory: null
  test:
    datasets:
      lam:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 2021-01-01
        end: 2021-05-31
        trajectory: null
      combined_surface:
        dataset_config:
          dataset: ${system.input.combined_surface}
          frequency: ${data.frequency}
          drop:
          - seqno
          - obsvalue_td2m_0
          window: (-6h,0]
        start: 2021-01-01
        end: 2021-05-31
        trajectory: null
diagnostics:
  plot:
    settings:
      asynchronous: true
      datashader: true
      projection_kind: equirectangular
      precip_and_related_fields: []
      colormaps:
        default:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: viridis
        error:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: bwr
    frequency:
      batch: 5
      epoch: 1
    parameters: []
    sample_idx: 0
    datasets_to_plot: []
    focus_areas: {}
    callbacks:
      - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
        dataset_names: ["lam"]
        parameter_groups: {}
        every_n_batches: ${diagnostics.plot.frequency.batch}
        plot_fn:
          _target_: anemoi.training.diagnostics.evaluation.plotting.loss.loss_plot_fn
          _partial_: true
      - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
        tag_infix: sample
        dataset_names: ["lam"]
        sample_idx: ${diagnostics.plot.sample_idx}
        parameters:
          - z_500
          - t_850
          - 2t
          - 10u
          - 10v
        every_n_batches: ${diagnostics.plot.frequency.batch}
        plot_fn:
          _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.sample_plot_fn
          _partial_: true
          per_sample: 6
  callbacks: []
  benchmark_profiler:
    memory:
      enabled: true
      steps: 5
      warmup: 20
      extra_plots: false
      trace_rank0_only: false
    time:
      enabled: false
      verbose: false
    speed:
      enabled: true
    system:
      enabled: false
    model_summary:
      enabled: false
    snapshot:
      enabled: false
      steps: 4
      warmup: 0
  log:
    mlflow:
      enabled: true
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      offline: true
      authentication: true
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: anemobs
      project_name: AIFS
      system: false
      terminal: true
      run_name: 'anemoi-fastda-lam-debug'
      prefix: ''
      log_hyperparams: true
      on_resume_create_child: true
      expand_hyperparams:
      - config
      http_max_retries: 35
      max_params_length: 3000
      save_dir: ${system.output.logs.mlflow}
      log_model: false
    interval: 100
    wandb:
      entity: a
  debug:
    anomaly_detection: false
  enable_checkpointing: true
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 5
      num_models_saved: -1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  enable_progress_bar: true
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 1
  check_val_every_n_epoch: 1
  print_memory_summary: false
system:
  output:
    root: ${oc.env:SCRATCH}/anemoi-test/fastda-lam/
    logs:
      root: logs
      wandb: wandb
      mlflow: mlflow
      tensorboard: tensorboard
    checkpoints:
      root: checkpoint
      every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
      every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
      every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
    plots: plots
    profiler: profiler
  input:
    lam: cerra-rr-an-oper-0001-mars-5p5km-1984-2021-3h-v3-rmi
    forcing_dataset: aifs-ea-an-oper-0001-mars-o96-1979-2024-6h-v1-for-single-v2
    combined_surface: dop-ea-ofb-0001-1979-2025-v2-combined-surface-observations
    graph: null
    loss_matrices_path: null
    truncation: null
    truncation_inv: null
    warm_start: null
  hardware:
    accelerator: auto
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
graph:
  overwrite: true
  nodes:
    lam:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.lam.dataset_config}
      attributes: ${graph.attributes.nodes}
    combined_surface:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.combined_surface.dataset_config}
      attributes: {}
    hidden:
      node_builder:
        _target_: anemoi.graphs.nodes.LimitedAreaTriNodes
        resolution: 6
        reference_node_name: lam
        mask_attr_name: cutout_mask
        # Hidden nodes are kept within this distance of a LAM point. The thinned CERRA grid is
        # ~55 km apart, so the margin must exceed half its diagonal (~39 km); the 10 km of the
        # packaged graph/limited_area.yaml suits the full 5.5 km grid and leaves holes here.
        margin_radius_km: 50
  edges:
  # Encoders
  - source_name: lam
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.CutOffEdges
      cutoff_factor: 0.6
      source_mask_attr_name: null
      target_mask_attr_name: null
    - _target_: anemoi.graphs.edges.CutOffEdges # connects only boundary nodes
      cutoff_factor: 1.5
      source_mask_attr_name: boundary_mask
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: combined_surface
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.CutOffEdges
      cutoff_distance_km: 150
      max_num_neighbours: 32
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  # Processor
  - source_name: hidden
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.MultiScaleEdges
      x_hops: 1
      scale_resolutions: ${graph.nodes.hidden.node_builder.resolution}
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  # Decoder: only onto the CERRA domain
  - source_name: hidden
    target_name: lam
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: cutout_mask
    attributes: ${graph.attributes.edges}
  attributes:
    nodes:
      cutout_mask:
        _target_: anemoi.graphs.nodes.attributes.CutOutMask
      boundary_mask:
        _target_: anemoi.graphs.nodes.attributes.BooleanNot
        masks:
          _target_: anemoi.graphs.nodes.attributes.CutOutMask
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.MaskedPlanarAreaWeights
        mask_node_attr_name: cutout_mask
        norm: unit-max
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-std
      edge_dirs:
        _target_: anemoi.graphs.edges.attributes.EdgeDirection
        norm: unit-std
  post_processors: []
model:
  num_channels: 512
  cpu_offload: false
  keep_batch_sharded: false
  model:
    _target_: anemoi.models.models.AnemoiModelEncProcDec
    hidden_nodes_name: hidden
    latent_skip: true
  layer_kernels:
    LayerNorm:
      _target_: torch.nn.LayerNorm
    Linear:
      _target_: torch.nn.Linear
    Activation:
      _target_: torch.nn.GELU
    QueryNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
    KeyNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
  processor:
    _target_: anemoi.models.layers.processor.GraphTransformerProcessor
    num_channels: ${model.num_channels}
    trainable_size: 8
    sub_graph_edge_attributes: ["edge_length", "edge_dirs"]
    num_layers: 16
    num_chunks: 2
    mlp_hidden_ratio: 4
    num_heads: 16
    qk_norm: false
    cpu_offload: ${model.cpu_offload}
    gradient_checkpointing: true
    layer_kernels: ${model.layer_kernels}
    graph_attention_backend: triton
    edge_pre_mlp: false
  encoders:
    analysis:
      source_datasets: [ "lam" ]
      dataset_fusing_strategy: "none"
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
        num_channels: ${model.num_channels}
        trainable_size: 8
        sub_graph_edge_attributes: ["edge_length", "edge_dirs"]
        num_chunks: 1
        mlp_hidden_ratio: 4
        num_heads: 16
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
    combined_surface:
      source_datasets: [ "combined_surface" ]
      dataset_fusing_strategy: "none"
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
        num_channels: ${model.num_channels}
        trainable_size: 0
        sub_graph_edge_attributes: ["edge_length", "edge_dirs"]
        num_chunks: 1
        mlp_hidden_ratio: 4
        num_heads: 16
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
  latent_aggregator:
    _target_: anemoi.models.layers.aggregator.SumAggregator
  decoders:
    analysis:
      target_datasets: [ "lam" ]
      target_node_features: [ "encoded_data" ]
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: ${model.num_channels}
        trainable_size: 8
        sub_graph_edge_attributes: ["edge_length", "edge_dirs"]
        num_chunks: 1
        mlp_hidden_ratio: 4
        num_heads: 16
        initialise_data_extractor_zero: false
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
  bounding:
    datasets:
      lam: []
  residual:
    datasets:
      lam:
        _target_: anemoi.models.layers.residual.SkipConnection
        step: -1
  output_mask:
    datasets:
      lam:
        _target_: anemoi.training.utils.masks.Boolean1DMask
        attribute_name: cutout_mask
      combined_surface:
        _target_: anemoi.training.utils.masks.NoOutputMask
  compile: []
  node_trainable_parameters:
    lam: 8
    combined_surface: 0
    hidden: 8
task:
  _target_: anemoi.training.tasks.Forecaster
  # With multistep_input > 1, observation windows are stacked on the node axis
  multistep_input: 1
  multistep_output: 1
  timestep: 6H
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1
  # Two validation steps exercise the LAM boundary refill (`Boolean1DMask.rollout_boundary`).
  validation_rollout: 2
training:
  scalers:
    datasets:
      lam:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            q: 0.6
            t: 6
            u: 0.8
            v: 0.5
            z: 12
            sp: 10
            10u: 0.1
            10v: 0.1
            2d: 0.5
        pressure_level:
          _target_: anemoi.training.losses.scalers.ReluVariableLevelScaler
          group: pl
          y_intercept: 0.2
          slope: 0.001
        # Area weights of the CERRA domain; the output mask sets them to zero on the boundary.
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_attribute_name: area_weight
          norm: unit-sum
  optimization:
    optimizer:
      _target_: torch.optim.AdamW
      betas: [0.9, 0.95]
      weight_decay: 0.1
    lr_scheduler:
      _target_: timm.scheduler.CosineLRScheduler
      lr_min: 3.0e-07
      t_initial: ${training.max_steps}
      warmup_t: 1000
      t_in_epochs: false
    lr: 6.25e-05
    pl_lr_scheduler:
      interval: step
  run_id: null
  fork_run_id: null
  transfer_learning: false
  load_weights_only: false
  update_ds_stats_on_ckpt_load:
    states: false
    tendencies: true
  deterministic: false
  precision: bf16-mixed
  accum_grad_batches: 1
  num_sanity_val_steps: 0
  gradient_clip:
    val: 1.0
    algorithm: norm
  method:
    _target_: anemoi.training.train.methods.SingleTraining
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}
  loss_gradient_scaling: false
  max_epochs: 100
  max_steps: 75000
  submodules_to_freeze: []
  training_loss:
    datasets:
      lam:
        _target_: anemoi.training.losses.MSELoss
        scalers: ["general_variable", "pressure_level", "node_weights"]
        ignore_nans: true
  validation_metrics:
    datasets:
      lam:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: ["node_weights"]
          ignore_nans: true
  variable_groups:
    datasets:
      lam:
        default: sfc
        pl:
          param:
          - q
          - t
          - u
          - v
          - z
      combined_surface:
        default: sfc
  metrics:
    datasets:
      lam:
      - z_500
      - t_850
      - u_850
      - v_850
      - 2t
config_validation: false
