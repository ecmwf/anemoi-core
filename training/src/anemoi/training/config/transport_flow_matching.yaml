# Transport training on one dataset with flow matching.
defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- system: example
- graph: multi_scale
- model: graphtransformer_transport
- task: forecaster
- training: transport
- _self_

# set to true to switch on config validation
config_validation: True

model:
  model:
    transport:
      objective: flow_matching
      noise_embedder:
        # Frequencies from 1000 down to about 1.5 radians per unit of t, so the embedding varies
        # over t in [0, 1]. Flux embeds 1000 * t for the same reason.
        scale: 1000
      inference_defaults:
        sampling_schedule:
          schedule_type: unit_time
          num_steps: 50
        sampler:
          sampler: heun

training:
  transport:
    # Time drawn once per sample and ensemble member during training.
    training_condition:
      distribution: uniform_time
