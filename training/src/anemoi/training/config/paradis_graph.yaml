defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- system: example
- graph: trirefined_local
- model: paradis_graph
- task: forecaster
- training: single
- _self_

config_validation: True

### This file is for local experimentation.
##  When you commit your changes, assign the new features and keywords
##  to the correct defaults.
# For example to change from default GPU count:
# hardware:
#   num_gpus_per_node: 1

diagnostics:
  plot:
    callbacks: []

system:
  input:
    graph: null
    dataset: aifs-ea-an-oper-0001-mars-${data.resolution}-1979-2022-6h-v6
    loss_matrices_path: null
  output:
    root: paradis/
  hardware:
    accelerator: auto
    num_gpus_per_ensemble: 1
    num_gpus_per_node: 4
    num_nodes: 1
    num_gpus_per_model: 1

model:
  num_channels: 1024
  node_trainable_parameters:
    data: 0
    hidden: 0

  edge_trainable_parameters:
    data2hidden: 0
    hidden2data: 0

dataloader:
  limit_batches:
    training: null
    validation: null
  batch_size:
    training: 1
    validation: 1
  num_workers:
    training: 2
    validation: 2

data:
  resolution: n320

training:
  max_epochs: null
  max_steps: 100000

  training_loss:
    datasets:
      data:
        _target_: anemoi.training.losses.ReversedHuberLoss
        scalers: ['pressure_level', 'general_variable', 'node_weights']
        ignore_nans: False
  validation_metrics:
    datasets:
      data:
        rev_huber:
          _target_: anemoi.training.losses.ReversedHuberLoss
          scalers: ['node_weights']
          ignore_nans: True
