# Dataloader configuration for spatial downscaling with three datasets:
#   in_lres  — low-resolution conditioning input (separate zarr)
#   in_hres  — high-resolution forcings (same zarr as out_hres)
#   out_hres — high-resolution prediction target (same zarr as in_hres)

prefetch_factor: 2
pin_memory: True
read_group_size: ${system.hardware.num_gpus_per_model}

num_workers:
  training: 4
  validation: 4
  test: 4

batch_size:
  training: 1
  validation: 1
  test: 1

limit_batches:
  training: null
  validation: null
  test: 20

dataset: ${system.input.dataset}

training:
  datasets:
    in_lres:
      dataset_config:
        dataset: ${system.input.dataset_lres}
        frequency: ${data.frequency}
      start: null
      end: 2020
    in_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: null
      end: 2020
    out_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: null
      end: 2020

validation:
  datasets:
    in_lres:
      dataset_config:
        dataset: ${system.input.dataset_lres}
        frequency: ${data.frequency}
      start: 2021
      end: 2021
    in_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: 2021
      end: 2021
    out_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: 2021
      end: 2021

test:
  datasets:
    in_lres:
      dataset_config:
        dataset: ${system.input.dataset_lres}
        frequency: ${data.frequency}
      start: 2022
      end: null
    in_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: 2022
      end: null
    out_hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
      start: 2022
      end: null
