# Dataloader of the spatial downscaler: lres from the low-resolution dataset, hres (forcings and the
# fields to downscale) from the high-resolution one. Both read the same dates.
prefetch_factor: 2
pin_memory: True
# keep dataloader workers alive between epochs instead of starting new ones every epoch
persistent_workers: False
fake_dataloading: False

loading_policy:
  _target_: anemoi.training.data.loading.SynchronizedLoadingPolicy

# Form subgroups of model comm groups that read data together; see dataloader/multi.yaml.
read_group_size: ${system.hardware.num_gpus_per_model}

num_workers:
  training: 4
  validation: 4
  test: 4
batch_size:
  training: 1
  validation: 1
  test: 1

# runs only N batches [N = integer | null]; null runs through all of them
limit_batches:
  training: null
  validation: null
  test: 20

training:
  datasets:
    lres:
      dataset_config:
        dataset: ${system.input.dataset_lres}
        frequency: ${data.frequency}
        select: [2t, 10u, 10v, tp]
      start: null
      end: 2020
    hres:
      dataset_config:
        dataset: ${system.input.dataset}
        frequency: ${data.frequency}
        select: [2t, 10u, 10v, tp, cos_latitude, cos_longitude, sin_latitude, sin_longitude, cos_julian_day,
          cos_local_time, sin_julian_day, sin_local_time, lsm]
      start: null
      end: 2020

validation:
  datasets:
    lres:
      dataset_config: ${dataloader.training.datasets.lres.dataset_config}
      start: 2021
      end: 2021
    hres:
      dataset_config: ${dataloader.training.datasets.hres.dataset_config}
      start: 2021
      end: 2021

test:
  datasets:
    lres:
      dataset_config: ${dataloader.training.datasets.lres.dataset_config}
      start: 2022
      end: null
    hres:
      dataset_config: ${dataloader.training.datasets.hres.dataset_config}
      start: 2022
      end: null
