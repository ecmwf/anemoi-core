# Spatial downscaling with EDM diffusion: the model predicts the high-resolution dataset hres from the
# low-resolution dataset lres, projected onto the hres grid, and the hres forcings. The fields lres
# also has are learned as residuals against it (model.residual_reference).
defaults:
- data: downscaling
- dataloader: downscaling
- diagnostics: evaluation
- system: example
- graph: downscaling
- model: graphtransformer_transport_downscaler
- task: spatial_downscaler
- training: downscaling
- _self_

config_validation: True

system:
  input:
    # High-resolution dataset (hres: forcings and the fields to downscale).
    dataset: ???
    # Low-resolution dataset (lres).
    dataset_lres: ???
    # Sparse projection matrix (.npz) from the lres grid onto the hres grid, used by lres's spatial processor.
    truncation: ???
    # Normalisation statistics of the residuals hres - lres (.npz), see data.datasets.hres.residual_statistics.
    residual_statistics: ???

diagnostics:
  plot:
    # Only hres is predicted; lres is shown as the input of its plots, projected onto the hres grid,
    # with the predicted and true residuals against it.
    datasets_to_plot: [hres]
    parameters: [2t, 10u, 10v, tp]
    callbacks:
      - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
        dataset_names: ${diagnostics.plot.datasets_to_plot}
        parameter_groups:
          sfc_wind: [10u, 10v]
        every_n_batches: ${diagnostics.plot.frequency.batch}
      - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
        tag_infix: sample
        dataset_names: ${diagnostics.plot.datasets_to_plot}
        sample_idx: ${diagnostics.plot.sample_idx}
        parameters: ${diagnostics.plot.parameters}
        every_n_batches: ${diagnostics.plot.frequency.batch}
        with_auxiliary: true
        plot_fn:
          _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.sample_plot_fn
          _partial_: true
      - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
        tag_infix: histo
        dataset_names: ${diagnostics.plot.datasets_to_plot}
        sample_idx: ${diagnostics.plot.sample_idx}
        parameters: ${diagnostics.plot.parameters}
        every_n_batches: ${diagnostics.plot.frequency.batch}
        plot_fn:
          _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.histogram_plot_fn
          _partial_: true

model:
  model:
    transport:
      objective: edm_diffusion
      inference_defaults:
        sampling_schedule:
          schedule_type: karras
          sigma_max: 100.0
          sigma_min: 0.02
          rho: 7.0
          num_steps: 50
        sampler:
          sampler: heun

training:
  transport:
    # Noise level drawn once per sample and ensemble member during training.
    training_condition:
      distribution: karras
      sigma_max: 100.0
      sigma_min: 0.02
      rho: 7.0
