_target_: anemoi.training.tasks.QueryForecasting

lead_times: [1h, 3h, 6h]
input_history: 12h
max_input_times: 4
samples_per_epoch: 64
seed: 42

# Omission in a user query resolves to this product, never to implicit truth.
reference_provenance: ERA5
target_variables: null
input_variables: null
variable_weights: {}
provenance_weights: {}
loss_weights: {}
spatial_weighting: uniform  # Or cosine_latitude for regular latitude/longitude grids.

source_dropout: 0.1
field_dropout: 0.1
history_dropout: 0.1
input_context_margin_degrees: 2.0
global_context_sources: ["${model.query.stretched_grid.context_source}"]
target_regions:
  - [-15.0, 55.0, 35.0, 72.0]
# Product-specific entries override target_regions and may lie outside the refined area.
target_regions_by_provenance: {}

# Analysis values are treated as available only at/before origin minus this lag.
availability_policy: retrospective
availability_lag: {}

aliases: {}
validation_seed: 17
validation_samples: 8
