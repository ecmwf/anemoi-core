# @package _global_
#
# O96 ERA5, GraphTransformerProcessor + GraphTransformer encoder/decoder, with
# HierarchicalEmbedder (pool per level, then pool across levels) as the input_transform.
# Run with: anemoi-training train --config-name=o96_era5_hierarchical_embedder
# (after `anemoi-training config generate` has copied this config tree locally)

defaults:
  - override /data: zarr
  - override /dataloader: native_grid
  - override /diagnostics: evaluation
  - override /system: example
  - override /graph: multi_scale
  - override /model: graphtransformer
  - override /task: forecaster
  - override /training: single
  - _self_

graph:
  overwrite: False

system:
  hardware:
    num_gpus_per_node: 4
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: /leonardo_work/DestE_340_26/ai-ml/datasets/aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    graph: ${system.output.root}/graph.pt
  output:
    root: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-hierarchical-embedder
    logs:
      mlflow: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-comparison-mlflow

diagnostics:
  log:
    mlflow:
      enabled: True
      tracking_uri: ${system.output.root}/mlflow
      offline: True
      run_name: o96-graphtransformer-hierarchical-embedder-ln

data:
  datasets:
    data:
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.joint_variable_normalizer.JointVariableNormalizer

model:
  # d_model must be divisible by nhead (both ClsSelfAttentionPool stages use nn.MultiheadAttention).
  input_transform:
    _target_: anemoi.models.layers.embedder.HierarchicalEmbedder
    hidden_dim: 63
    d_model: 64
    nhead: 4
