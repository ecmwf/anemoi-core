# @package _global_
#
# O96 ERA5, GraphTransformerProcessor + GraphTransformer encoder/decoder.
# Run with: anemoi-training train --config-name=o96_era5_transformer
# (after `anemoi-training config generate` has copied this config tree locally)

defaults:
  - override /data: zarr
  - override /dataloader: native_grid
  - override /diagnostics: evaluation
  - override /system: example
  - override /graph: multi_scale
  - override /model: graphtransformer
  - override /task: forecaster
  - override /training: single
  - _self_

# native_grid.yaml's defaults (batch_size 2/gpu, read_group_size = num_gpus_per_model)
# are tuned for O96 assuming 8 GPUs -> effective batch size 16. With num_gpus_per_node: 4
# below, effective batch size is 8 - half of the tuned target, but a real comparison run
# (not just a memory-fit smoke test).
graph:
  # multi_scale.yaml defaults to overwrite: True (always rebuilds); flip it off so the
  # cached graph.pt at system.input.graph is reused after the first successful build.
  # GraphTransformerProcessor (unlike plain TransformerProcessor) needs the hidden->hidden
  # edges multi_scale.yaml builds by default, so no edges override here.
  overwrite: False

system:
  hardware:
    num_gpus_per_node: 4
    num_nodes: 1
    num_gpus_per_model: 1  # raise this only if O96 + this model doesn't fit on one GPU
  input:
    dataset: /leonardo_work/DestE_340_26/ai-ml/datasets/aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    graph: ${system.output.root}/graph.pt  # built once here on first run (own dataset), then reused
  output:
    root: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-embedder  # separate from o96-baseline, for comparison
    logs:
      mlflow: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-comparison-mlflow

diagnostics:
  log:
    mlflow:
      enabled: True
      tracking_uri: ${system.output.root}/mlflow  # local file store, no server needed
      offline: True  # no server to sync to - stays local
      run_name: o96-graphtransformer-embedder  # distinguishes it from o96-baseline in the mlflow UI

data:
  # JointVariableNormalizer instead of the default InputNormalizer: pools mean/stdev across all
  # pressure levels of the same physical variable, instead of normalizing each level on its own -
  # see JointVariableNormalizer's docstring. Keeps the rest of zarr.yaml's normalizer.config as-is
  # (default method, per-variable overrides), only the _target_ changes.
  datasets:
    data:
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.joint_variable_normalizer.JointVariableNormalizer

model:
  # Replaces the raw per-variable input the encoder would otherwise see with a learned
  # embedding (per physical variable + pressure level) before the encoder mapper runs -
  # see model.input_transform hook in AnemoiModelEncProcDec._assemble_input.
  # mean/std intentionally omitted: JointVariableNormalizer above already normalizes upstream,
  # so FeatureTokenizer's own defaults (mean=0, std=1 - i.e. a no-op) are what we want here.
  input_transform:
    _target_: anemoi.models.layers.embedder.Embedder
    dim: 16
    d_model: 64
    nhead: 4

# multi_scale.yaml's hidden mesh (TriNodes, resolution: 5, ~10k nodes) is the standard
# pairing for O96 data (~40k grid points) - left as default, no override needed here.
