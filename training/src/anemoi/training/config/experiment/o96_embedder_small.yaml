# @package _global_
#
# O96 ERA5, GraphTransformerProcessor + GraphTransformer encoder/decoder, PMAEmbedder - SMALL.
# Half num_channels (512) and half processor num_layers (8) vs. o96_era5_embedder.yaml, to fit
# more training steps in the same wall-clock budget and actually see convergence trends. Logs to
# a separate mlflow store (o96-comparison-mlflow-small) - not comparable to the full-size runs.
# Run with: anemoi-training train --config-name=o96_embedder_small

defaults:
  - override /data: zarr
  - override /dataloader: native_grid
  - override /diagnostics: evaluation
  - override /system: example
  - override /graph: multi_scale
  - override /model: graphtransformer
  - override /task: forecaster
  - override /training: single
  - _self_

graph:
  overwrite: False

# training batch_size x2 vs. the full-size runs - the smaller model frees up GPU memory,
# and doubling amortizes kernel-launch overhead over more samples per step. lr x2 alongside
# it (linear scaling rule - Goyal et al.), to keep training dynamics comparable, not just
# faster. validation/test batch_size unchanged.
dataloader:
  batch_size:
    training: 4
    validation: 4
    test: 4

training:
  optimization:
    lr: 1.25e-4

system:
  hardware:
    num_gpus_per_node: 4
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    dataset: /leonardo_work/DestE_340_26/ai-ml/datasets/aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    graph: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-baseline/graph.pt
  output:
    root: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-embedder-small
    logs:
      mlflow: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-comparison-mlflow-small

diagnostics:
  log:
    mlflow:
      enabled: True
      tracking_uri: ${system.output.root}/mlflow
      offline: True
      run_name: o96-graphtransformer-embedder-small

data:
  datasets:
    data:
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.joint_variable_normalizer.JointVariableNormalizer

model:
  num_channels: 512
  processor:
    num_layers: 8
  input_transform:
    _target_: anemoi.models.layers.embedder.PMAEmbedder
    dim: 16
    d_model: 64
    nhead: 4
