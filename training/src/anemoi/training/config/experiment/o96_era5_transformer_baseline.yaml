# @package _global_
#
# O96 ERA5, GraphTransformerProcessor + GraphTransformer encoder/decoder - BASELINE (no embedder).
# Identical to o96_era5_transformer.yaml except: default InputNormalizer (per-column, not pooled
# by physical variable) and no model.input_transform (plain Linear input to the encoder, as usual).
# Run alongside o96_era5_transformer.yaml to compare with/without the embedder.
# Run with: anemoi-training train --config-name=o96_era5_transformer_baseline
# (after `anemoi-training config generate` has copied this config tree locally)

defaults:
  - override /data: zarr
  - override /dataloader: native_grid
  - override /diagnostics: evaluation
  - override /system: example
  - override /graph: multi_scale
  - override /model: graphtransformer
  - override /task: forecaster
  - override /training: single
  - _self_

# native_grid.yaml's defaults (batch_size 2/gpu, read_group_size = num_gpus_per_model)
# are tuned for O96 assuming 8 GPUs -> effective batch size 16. With num_gpus_per_node: 4
# below, effective batch size is 8 - half of the tuned target, but a real comparison run
# (not just a memory-fit smoke test).
graph:
  # multi_scale.yaml defaults to overwrite: True (always rebuilds); flip it off so the
  # cached graph.pt at system.input.graph is reused after the first successful build.
  # GraphTransformerProcessor (unlike plain TransformerProcessor) needs the hidden->hidden
  # edges multi_scale.yaml builds by default, so no edges override here.
  overwrite: False

system:
  hardware:
    num_gpus_per_node: 4
    num_nodes: 1
    num_gpus_per_model: 1  # raise this only if O96 + this model doesn't fit on one GPU
  input:
    dataset: /leonardo_work/DestE_340_26/ai-ml/datasets/aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    graph: ${system.output.root}/graph.pt  # built once here on first run (own dataset), then reused
  output:
    root: /leonardo_work/DestE_340_26/users/jschrei1/anemoi-core/runs/o96-baseline  # separate from o96-embedder, for comparison

diagnostics:
  log:
    mlflow:
      enabled: True
      tracking_uri: ${system.output.root}/mlflow  # local file store, no server needed
      offline: True  # no server to sync to - stays local
      run_name: o96-graphtransformer-baseline  # distinguishes it from o96-embedder in the mlflow UI

# no data.datasets.data.processors.normalizer override -> default InputNormalizer (per-column)
# no model.input_transform override -> default nn.Identity (plain Linear input to the encoder)

# multi_scale.yaml's hidden mesh (TriNodes, resolution: 5, ~10k nodes) is the standard
# pairing for O96 data (~40k grid points) - left as default, no override needed here.
