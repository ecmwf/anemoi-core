# base config which defines settings shared across all benchmarks

system:
  hardware:
    accelerator: cuda
    num_gpus_per_node: 2
    num_nodes: 1

dataloader:
  num_workers:
    training: 8
    validation: 8
  limit_batches:
    training: 200
    validation: 0
  batch_size:
    training: 1
    validation: 1

graph:
  overwrite: False

model:
  encoder:
    num_chunks: 2
  decoder:
    num_chunks: 2
  processor:
    num_chunks: 2
  num_channels: 512

training:
  max_epochs: 1
  num_sanity_val_steps: 0

  # NOTE: the distributed strategy is intentionally not overridden here.
  # Each benchmark template already selects the correct strategy via its
  # `training` defaults (DDPGroupStrategy for deterministic runs,
  # DDPEnsGroupStrategy for ensemble runs). Forcing DDPGroupStrategy here
  # deep-merges onto the ensemble strategy block and leaves a stale
  # `num_gpus_per_ensemble` kwarg, which DistributedDataParallel rejects.

diagnostics:
  callbacks: []
  plot:
    callbacks: []
  enable_checkpointing: False
  print_memory_summary: true
  benchmark_profiler:
    memory:
      enabled: true
    time:
      verbose: true
    model_summary:
      enabled: false
    snapshot:
      enabled: true
    system:
      enabled: false #some error about metric key in extract_gpu_metrics being invalid
  log:
    mlflow:
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      enabled: true
      offline: True
      tracking_uri: ""
    interval: 1
