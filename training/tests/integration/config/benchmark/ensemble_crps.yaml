# configuration for the "ensemble_crps" benchmark
system:
  hardware:
    num_gpus_per_model: 1
    num_gpus_per_ensemble: 2
  input:
    dataset:  /home/mlx/ai-ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v8.zarr
    graph: ./ens-bm-graph.pt
    truncation: null
    truncation_inv: null
    loss_matrices_path: "anemoi-integration-tests/training/assets/"

training:
  ensemble_size_per_device: 1
  training_loss:
    datasets:
      data:
        # benchmark smoothing over a neighbour list built from the graph; on N320, 128 neighbours
        # reach about 0.031 rad, twice the widest sigma
        multiscale_config: {num_nearest_neighbours: 128, sigmas: [0.0157, 0.0078, 0.0039]}
        weights: [1.0, 1.0, 1.0, 4.0]
  validation_metrics:
    datasets:
      data:
        multiscale:
          multiscale_config: {num_nearest_neighbours: 128, sigmas: [0.0157, 0.0078, 0.0039]}
          weights: [1.0, 1.0, 1.0, 4.0]

dataloader:
  training:
    datasets:
      data:
        end: 2020-11-30
  validation:
    datasets:
      data:
        start: 2020-12-31

graph:
  nodes:
    hidden:
      node_builder:
        resolution: 6

model:
  num_channels: 256
  # benchmark also compiles CRPS, in the default mode (max-autotune re-records CUDA graphs every step)
  compile:
    - module: anemoi.models.layers.conv.GraphTransformerConv
    - module: anemoi.models.layers.normalization.ConditionalLayerNorm
    - module: anemoi.training.losses.CRPS
      options:
        dynamic: false
        fullgraph: true
