# configuration for the "ensemble_crps" benchmark
system:
  hardware:
    num_gpus_per_model: 1
    num_gpus_per_ensemble: 2
  input:
    dataset:  /home/mlx/ai-ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v8.zarr
    graph: ./ens-bm-graph.pt
    truncation: null
    truncation_inv: null
    loss_matrices_path: "anemoi-integration-tests/training/assets/"

training:
  ensemble_size_per_device: 1
  training_loss:
    datasets:
      data:
        # benchmark building smoothing matrices on the fly
        multiscale_config: {smoothers: {smooth_4x: {num_nearest_neighbours: 64, sigma: 0.0628}, smooth_2x: {num_nearest_neighbours: 32, sigma: 0.0314}, smooth_1x: {num_nearest_neighbours: 16, sigma: 0.0157}}}
        weights: [1.0, 1.0, 1.0, 4.0]
  validation_metrics:
    datasets:
      data:
        multiscale:
          multiscale_config: {smoothers: {smooth_4x: {num_nearest_neighbours: 64, sigma: 0.0628}, smooth_2x: {num_nearest_neighbours: 32, sigma: 0.0314}, smooth_1x: {num_nearest_neighbours: 16, sigma: 0.0157}}}
          weights: [1.0, 1.0, 1.0, 4.0]

dataloader:
  training:
    datasets:
      data:
        end: 2020-11-30
  validation:
    datasets:
      data:
        start: 2020-12-31

graph:
  nodes:
    hidden:
      node_builder:
        resolution: 6

model:
  num_channels: 256
