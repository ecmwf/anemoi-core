# ---------------------------------------------------------------
# AICON settings for execution in a CI/CD pipeline.
#
# 10/2026, DWD
# ---------------------------------------------------------------

system:
  input:
    graph: null
    # reduced for CI/CD test.
    dataset: dwd/2024-12-11_00/dataset_20220101_20230101_6H.zarr
    forcing_dataset: dwd/2024-12-11_00/forcings_20220101_20230101_6H.zarr
    warm_start: null
  output:
    root: output_training/${data.resolution}
    checkpoints:
      root: checkpoint
      every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
      every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
      every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
    plots: plots
    logs:
      root: logs
      wandb: ""
      mlflow: mlflow
      tensorboard: tensorboard
    profiler: profiler
  # number of GPUs per node and number of nodes (for DDP)
  hardware:
    accelerator: auto
    num_gpus_per_node: 1 # reduced for CI/CD test.
    num_nodes: 1
    num_gpus_per_model: 1

data:
  remapped:
  format: zarr
  resolution: mrl${data.refinement}
  refinement: ${graph.nodes.data.node_builder.max_level}
  frequency: 6h # reduced for CI/CD test.
  timestep: ${data.frequency} # reduced for CI/CD test.
  datasets:
    data:
      forcing:
        - "HSURF"
        - "FR_LAND"
        - "Z0"
        - "FR_LAKE"
        - "EMIS_RAD"
        - "SSO_GAMMA"
        - "SSO_SIGMA"
        - "SSO_THETA"
        - "SSO_STDH"
        - "cos_latitude"
        - "sin_latitude"
        - "cos_longitude"
        - "sin_longitude"
        - "cos_julian_day"
        - "sin_julian_day"
        - "cos_local_time"
        - "sin_local_time"
        - "insolation"
        # - H_SNOW
        # - ALB_RAD
        # - SKT
        # - SMI_0
        # - SMI_1
        # - T_SO_0.0
        # - T_SO_0.005
      diagnostic:
        - PS # just for CI/CD test.

      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          # _convert_: all # deprecated?
          config:   # ${data.normalizer}
            default: mean-std
            min-max:
              - PS # just for CI/CD test.
            std:
            max:
              # - CLCT
              # - CLCL
              # - CLCM
              # - CLCH
              # - FR_LAND
              # - FR_LAKE
              # - FR_ICE
            none:
              - cos_latitude
              - cos_longitude
              - sin_latitude
              - sin_longitude
              - "cos_julian_day"
              - "sin_julian_day"
              - "cos_local_time"
              - "sin_local_time"
              - "insolation"
              - SSO_GAMMA
              - SSO_SIGMA
              - SSO_THETA

  num_features: null

graph:
  overwrite: True
  nodes:
    # Data nodes
    data:
      node_builder:
        _target_: anemoi.graphs.nodes.ICONCellGridNodes
        max_level: 3 # reduced for CI/CD test.
        grid_filename: dwd/2024-12-11_00/icon_grid_0026_R03B07_subsetAICON.nc
      attributes: ${graph.attributes.nodes}  # options: l1, l2, unit-max, unit-sum, unit-std
    # Hidden nodes
    hidden:
      node_builder:
        _target_: anemoi.graphs.nodes.ICONMultiMeshNodes
        max_level: 3 # reduced for CI/CD test.
        grid_filename: dwd/2024-12-11_00/icon_grid_0026_R03B07_subsetAICON.nc
  edges:
    # Processor configuration
    - source_name: "hidden"
      target_name: "hidden"
      edge_builders:
        - _target_: anemoi.graphs.edges.ICONTopologicalProcessorEdges
      attributes: ${graph.attributes.edges}
    # Encoder configuration
    - source_name: "data"
      target_name: "hidden"
      edge_builders:
        - _target_: anemoi.graphs.edges.ICONTopologicalEncoderEdges
      attributes: ${graph.attributes.edges}
    # Decoder configuration
    - source_name: "hidden"
      target_name: "data"
      edge_builders:
        - _target_: anemoi.graphs.edges.ICONTopologicalDecoderEdges
      attributes: ${graph.attributes.edges}
  attributes:
    nodes:
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights # options: Area, Uniform
        norm: unit-max  # options: l1, l2, unit-max, unit-sum, unit-std
        fill_value: 0
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-std
      edge_dirs:
        _target_: anemoi.graphs.edges.attributes.EdgeDirection
        norm: unit-std
task:
  _target_: anemoi.training.tasks.Forecaster
  multistep_input: 2
  multistep_output: 1
  timestep: ${data.timestep} # reduced for CI/CD test.
  rollout:
    start: 1
    epoch_increment: 1
    maximum: 1
  validation_rollout: 1


training:
  seed: 42
  run_id: null
  fork_run_id: null
  load_weights_only: False
  transfer_learning: False # activate to perform transfer learning
  method:
    _target_: anemoi.training.train.methods.SingleTraining
  deterministic: false
  precision: 16-mixed
  accum_grad_batches: 1
  num_sanity_val_steps: 4 # reduced for CI/CD test.
  gradient_clip:
    val: 32.0
    algorithm: value
  max_epochs: null
  max_steps: 20 # reduced for CI/CD test.
  optimization:
    lr: 0.0001
    optimizer:
      _target_: torch.optim.AdamW # or anemoi.training.optimizers.AdEMAMix.AdEMAMix
      betas: [0.9, 0.95]
    lr_scheduler:
      _target_: timm.scheduler.CosineLRScheduler
      lr_min: 3.0e-8
      t_initial: ${training.max_steps}
      warmup_t: 1000
      t_in_epochs: false
    pl_lr_scheduler:
      interval: step

  # select model (since CRPS PR)
  submodules_to_freeze: []
  # select strategy
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}
    static_graph: True
    find_unused_parameters: False

  loss_gradient_scaling: false
  # loss function for the model
  training_loss:
    datasets:
      data:
        # loss class to initialise
        _target_: anemoi.training.losses.MSELoss
        scalers: ["pressure_level", "general_variable", "node_weights"]
        ignore_nans: False
  validation_metrics:
    datasets:
      data:
        wmse:
          # loss class to initialise
          _target_: anemoi.training.losses.MSELoss
          scalers: ["node_weights"]
          # other kwargs
          ignore_nans: True

  variable_groups:
    datasets:
      data:
        default: sfc
        ml:
          param: [U, V, QV, P, T] #, W]
  metrics:
    datasets:
      data:
        - T_86
        - T_70
        - U_70
        - V_70
  scalers:
    datasets:
      data:
        # scaler name must be included in `scalers` in the losses for this to be applied.
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            U: 0.1 #0.05
            V: 0.1 #0.02
            W: 0.01
            P: 10
            PS: 10
            SMI: 0.1
            ALB_RAD: 0.1
            H_SNOW: 3.0
            T: 2

        pressure_level:
          _target_: anemoi.training.losses.scalers.LinearVariableLevelScaler
          group: ml #pl
          y_intercept: -1.85
          slope: 0.057

        nan_mask_weights:
          _target_: anemoi.training.losses.scalers.NaNMaskScaler

        # Scalers from node attributes
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_attribute_name: area_weight
          norm: unit-sum


dataloader:
  pin_memory: True
  persistent_workers: False
  fake_dataloading: False
  loading_policy:
    _target_: anemoi.training.data.loading.SynchronizedLoadingPolicy
  prefetch_factor: 1 # reduced for CI/CD test.
  read_group_size: ${system.hardware.num_gpus_per_model}
  validation_rollout: 1
  batch_size:
    training: 1 # reduced for CI/CD test.
    validation: 1 # reduced for CI/CD test.
    test: 1
    # predict: 1
  limit_batches:
    training: null
    validation: null
    test: 20
    # predict: 20
  training:
    datasets:
      data:
        start: "2022-01-04T06:00:00"
        end: "2022-01-06T06:00:00"
        dataset_config:
          dataset:
            join:
              - ${system.input.dataset}
              - ${system.input.forcing_dataset}
            frequency: ${data.frequency}
            select: &selected_vars
              - P_101
              - P_49
              - P_57
              - P_64
              - P_70
              - P_75
              - P_79
              - P_86
              - P_91
              - P_96
              - T_101
              - T_49
              - T_57
              - T_64
              - T_70
              - T_75
              - T_79
              - T_86
              - T_91
              - T_96
              - U_101
              - U_49
              - U_57
              - U_64
              - U_70
              - U_75
              - U_79
              - U_86
              - U_91
              - U_96
              - V_101
              - V_49
              - V_57
              - V_64
              - V_70
              - V_75
              - V_79
              - V_86
              - V_91
              - V_96
              - EMIS_RAD
              - FR_LAKE
              - FR_LAND
              - HSURF
              - SSO_GAMMA
              - SSO_SIGMA
              - SSO_STDH
              - SSO_THETA
              - Z0
              - cos_julian_day
              - cos_latitude
              - cos_local_time
              - cos_longitude
              - insolation
              - sin_julian_day
              - sin_latitude
              - sin_local_time
              - sin_longitude
              - PS
            drop: []
  validation:
    datasets:
      data:
        start: "2022-01-04T06:00:00"
        end: "2022-01-06T06:00:00"
        dataset_config:
          dataset:
            join:
              - ${system.input.dataset}
              - ${system.input.forcing_dataset}
            frequency: ${data.frequency}
            select: *selected_vars
            drop: []
  test:
    datasets:
      data:
        start: 2022
        end: 2023
        dataset_config:
          dataset:
            join:
              - ${system.input.dataset}
              - ${system.input.forcing_dataset}
            frequency: ${data.frequency}
            select: *selected_vars
            drop: []
  num_workers:
    training: 2 # reduced for CI/CD test.
    validation: 2 # reduced for CI/CD test.
    test: 1
    # predict: 1
  grid_indices:
    _target_: anemoi.training.data.grid_indices.FullGrid
    nodes_name: data #${graph.data}


model:
  num_channels: 8 # reduced for CI/CD test.
  cpu_offload: False

  keep_batch_sharded: True

  model:
    _target_: anemoi.models.models.AnemoiModelEncProcDec
    hidden_nodes_name: hidden

  layer_kernels:
    # The layer_kernels can be adjusted per model component, but are defined here for convenience.
    LayerNorm:
      _target_: torch.nn.LayerNorm
    Linear:
      _target_: torch.nn.Linear
    Activation:
      _target_: torch.nn.GELU
    QueryNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: False
    KeyNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: False

  processor:
    _target_: anemoi.models.layers.processor.GraphTransformerProcessor
    num_channels: ${model.num_channels}
    trainable_size: ${model.edge_trainable_parameters.hidden2hidden}
    sub_graph_edge_attributes: ${model.attributes.edges}
    num_layers: 2 # reduced for CI/CD test.
    num_chunks: 2 # reduced for CI/CD test.
    mlp_hidden_ratio: 2 # reduced for CI/CD test. # GraphTransformer or Transformer only
    num_heads: 2 # reduced for CI/CD test. # GraphTransformer or Transformer only
    qk_norm: False
    cpu_offload: ${model.cpu_offload}
    layer_kernels: ${model.layer_kernels}
    graph_attention_backend: "pyg" # just for CI/CD test. # Options: "triton", "pyg"

  encoders:
    "0":
      source_datasets: [ "data" ]
      dataset_fusing_strategy: "not_supported"
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
        num_channels: ${model.num_channels}
        trainable_size: ${model.edge_trainable_parameters.data2hidden}
        sub_graph_edge_attributes: ${model.attributes.edges}
        num_chunks: 4
        mlp_hidden_ratio: 4 # GraphTransformer or Transformer only
        num_heads: 4 # reduced for CI/CD test # GraphTransformer or Transformer only
        qk_norm: False
        cpu_offload: ${model.cpu_offload}
        layer_kernels: ${model.layer_kernels}
        shard_strategy: "edges"
        graph_attention_backend: "pyg" # just for CI/CD test. # Options: "triton", "pyg"

  latent_aggregator:
    _target_: anemoi.models.layers.aggregator.SumAggregator

  decoders:
    "0":
      target_datasets: [ "data" ]
      target_node_features: [ "encoded_data" ]
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: ${model.num_channels}
        trainable_size: ${model.edge_trainable_parameters.hidden2data}
        sub_graph_edge_attributes: ${model.attributes.edges}
        num_chunks: 2 # just for CI/CD test.
        mlp_hidden_ratio: 4 # GraphTransformer or Transformer only
        num_heads: 4 # reduced for CI/CD test # GraphTransformer or Transformer only
        initialise_data_extractor_zero: False
        qk_norm: False
        cpu_offload: ${model.cpu_offload}
        layer_kernels: ${model.layer_kernels}
        shard_strategy: "edges"
        graph_attention_backend: "pyg" # just for CI/CD test. # Options: "triton", "pyg"

  residual:
    datasets:
      data:
        _target_: anemoi.models.layers.residual.SkipConnection # options: SkipConnection, TruncatedConnection
        step: -1 # use the latest step as skip connection

  output_mask:
    datasets:
      data:
        _target_: anemoi.training.utils.masks.NoOutputMask

  node_trainable_parameters:
    data: 0
    hidden: 0
  edge_trainable_parameters:
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0 # GNN and GraphTransformer Processor only

  compile:
    #- module: anemoi.models.layers.conv.GraphTransformerConv

  attributes:
    edges:
      - edge_length
      - edge_dirs
    nodes: []

  # Bounding configuration
  bounding: #These are applied in order
    # Bound tp (total precipitation) with a Relu bounding layer
    # ensuring a range of [0, infinity) to avoid negative precipitation values.
    datasets:
      data:
        - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
          variables:
            - PS # just for CI/CD test
        - _target_: anemoi.models.layers.bounding.HardtanhBounding
          variables:
            - U_70 # just for CI/CD test.
          # values are percentages in [0, 100], min-max normalized to [0, 1].
          min_val: 0.0
          max_val: 1.0

diagnostics:
  plot:
    asynchronous: True # Whether to plot asynchronously
    datashader: True # Choose which technique to use for plotting
    frequency: # Frequency of the plotting
      batch: 750
      epoch: 10

    # Parameters to plot
    parameters:
     - PS
     - P_49
     - P_86
     - T_86
     - U_70
     - V_70
     # - RAIN_CON
    # Sample index
    sample_idx: 0

    # Precipitation and related fields
    precip_and_related_fields: [TOT_PREC, RAIN_CON]
    datasets_to_plot: ["data"]

    callbacks:
      # Add plot callbacks here
      - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
        dataset_names: ${diagnostics.plot.datasets_to_plot}
        parameter_groups: {}
        every_n_batches: 100 # Frequency of the plotting
      - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
        tag_infix: histo
        dataset_names: ${diagnostics.plot.datasets_to_plot}
        sample_idx: ${diagnostics.plot.sample_idx}
        parameters: ${diagnostics.plot.parameters}
        every_n_batches: 100 # Frequency of the plotting
        plot_fn:
          _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.histogram_plot_fn
          _partial_: true

  callbacks: []

  benchmark_profiler:
  # Use anemoi-profile to profile the training process
    memory:
      enabled: False
      steps: 5 # wait warmup steps and then do steps (too many steps would lead to a big file)
      warmup: 2
      extra_plots: False
      trace_rank0_only: False #set to true and it will profile rank 0 only. Reads SLURM_PROC_ID so won't work when not running via Slurm
    time:
      enabled: True
      verbose: False #If true, output every action the profiler caputres, otherwise output a subset defined in PROFILER_ACTIONS at the top of aifs/diagnostics/profiler.py
    speed:
      enabled: True
    system:
      enabled: False
    model_summary:
      enabled: False
    snapshot:
      enabled: False
      steps: 4 # wait warmup steps and then do steps
      warmup: 0

  debug:
    # this will detect and trace back NaNs / Infs etc. but will slow down training
    anomaly_detection: False

  # activate the pytorch profiler (disable this in production)
  # remember to also activate the tensorboard logger (below)

  enable_checkpointing: True
  checkpoint:
    every_n_minutes:
      save_frequency: 30 # Approximate, as this is checked at the end of training steps
      num_models_saved: 3 # If set to k, saves the 'last' k model weights in the training.

    every_n_epochs:
      save_frequency: 1
      num_models_saved: 3 # If set to -1, all checkpoints are kept ensuring runs can be continued/forked at any point in the training process

    every_n_train_steps:
      save_frequency: null # Does not scale with rollout
      num_models_saved: 0

  log:
    mlflow:
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      enabled: False # for CI/CD test.
      offline: False
      authentication: False
      log_model: False
      tracking_uri: null
      experiment_name: 'tgoecke/aicon_anemoi_training_0.17.0'
      project_name: 'AICON'
      system: True
      terminal: True
      run_name: rfl${data.refinement}_h${graph.nodes.data.node_builder.max_level}_${data.timestep}_${model.num_channels}_upgrade_20250719 # If set to null, the run name will be the a random UUID
      on_resume_create_child: False
      expand_hyperparams: # Which keys in hyperparams to expand
        - config
      http_max_retries: 35
      max_params_length: 2000
      save_dir: ${system.output.logs.mlflow}
    interval: 100

  enable_progress_bar: False # reduced for CI/CD test.
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 1
  check_val_every_n_epoch: 1
  print_memory_summary: False

# validate configuration
config_validation: True
