# This workflow checks that a PR declares whether the expensive integration
# tests are needed, via exactly one of these labels:
# - "run-expensive-tests": the expensive HPC tests run on every push (see
#   integration-tests-hpc.yml). Check passes.
# - "expensive-tests-not-needed": the author has opted out. Check passes.
# - Neither label: fail (forces an explicit decision before merging).

name: "[PR] Expensive-tests labels"

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled
      - synchronize

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR details
        uses: actions/github-script@v7
        id: check-pr
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const labels = pr.data.labels.map(label => label.name);
            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('author', context.payload.pull_request.user.login);

      - name: Evaluate expensive-tests labels
        run: |
          AUTHOR='${{ steps.check-pr.outputs.author }}'
          if [ "$AUTHOR" == "DeployDuck" ] || [ "$AUTHOR" == "pre-commit-ci[bot]" ]; then
            echo "Bot PR, skipping."
            exit 0
          fi
          LABELS=$(echo '${{ steps.check-pr.outputs.labels }}' | jq -r '.[]')
          echo "Labels found:"
          echo -e "$LABELS\n"
          echo "Result:"
          if echo "$LABELS" | grep -qi "run-expensive-tests"; then
            echo "'run-expensive-tests' present: expensive tests run on every push. Passing."
            EXIT_CODE=0
          elif echo "$LABELS" | grep -qi "expensive-tests-not-needed"; then
            echo "'expensive-tests-not-needed' present: expensive tests are skipped. Passing."
            EXIT_CODE=0
          else
            echo "No expensive-tests label found. Please add either 'run-expensive-tests'"
            echo "or 'expensive-tests-not-needed' to this PR. Failing."
            EXIT_CODE=1
          fi
          exit $EXIT_CODE
