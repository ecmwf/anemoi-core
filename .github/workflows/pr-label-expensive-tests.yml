# Gate that a PR declares whether the expensive integration tests are needed,
# via exactly one of these labels:
# - "run-expensive-tests": the expensive HPC tests run on every push (see
#   integration-tests-hpc.yml).
# - "expensive-tests-not-needed": the author has opted out.
#
# Rather than *failing* when a label is missing (a red X that desensitises
# reviewers to real test failures), this reports a neutral *pending* commit
# status 'expensive-tests-label' that only turns green once a label is present.
# Mark 'expensive-tests-label' as a required status check in the branch
# protection / ruleset for the target branch: a pending required check blocks
# the merge (grey button) without ever showing a failure.
#
# The decision logic is ecmwf/ci-infrastructure's require-label-decision, the
# same action other ECMWF repos use for their 'run-downstream-CI' label.

name: "[PR] Expensive-tests label gate"

on:
  # pull_request_target (not pull_request) so the job gets a read/write token on
  # fork PRs and can post the commit status; a plain pull_request from a fork
  # gets a read-only token and posting the status would fail. This is safe
  # despite pull_request_target's usual risk because the job only reads the
  # event payload (labels/author) and posts a status — it never checks out or
  # executes PR code, so untrusted fork code never runs with these permissions.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-slim
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-label-decision@main
        with:
          label: run-expensive-tests
          opt-out-label: expensive-tests-not-needed
          context: expensive-tests-label
          description-decided: Expensive-tests decision recorded
          # Release and pre-commit.ci autoupdate pull requests have nobody to
          # make the decision. A label on one is still honoured.
          exempt-authors: DeployDuck, pre-commit-ci[bot]
