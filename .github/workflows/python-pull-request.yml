name: Code Quality and Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: "9 2 * * 0" # at 9:02 on sunday
  workflow_dispatch:
  merge_group:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  quality:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-precommit-run.yml@v2
    with:
      skip-hooks: "no-commit-to-branch"

  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            python-version: "3.11"
            torch-version: "2.6.*"
          - platform: "ubuntu-latest"
            python-version: "3.12"
            torch-version: "2.8.*"
          - platform: "ubuntu-latest"
            python-version: "3.13"
            torch-version: "2.*"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install packages
        run: |
          uv pip install --torch-backend cpu \
            "torch==${{ matrix.torch-version }}" \
            -e "./training[all,tests]" \
            -e "./graphs[all,tests]" \
            -e "./models[all,tests]" \
            pytest pytest-md pytest-emoji

      - name: Run pytest for training package
        uses: pavelzw/pytest-action@v2
        with:
          report-title: "Test report Anemoi Training (python ${{ matrix.python-version }}, torch ${{ matrix.torch-version }} on ${{ matrix.platform }})"
          custom-pytest: pytest ./training

      - name: Run pytest for graphs package
        uses: pavelzw/pytest-action@v2
        with:
          report-title: "Test report Anemoi Graphs (python ${{ matrix.python-version }}, torch ${{ matrix.torch-version }} on ${{ matrix.platform }})"
          custom-pytest: pytest ./graphs

      - name: Run pytest for models package
        uses: pavelzw/pytest-action@v2
        with:
          report-title: "Test report Anemoi Models (python ${{ matrix.python-version }}, torch ${{ matrix.torch-version }} on ${{ matrix.platform }})"
          custom-pytest: pytest ./models
