# This workflow runs on release PRs created by release-please (the ecmwf-release-please App).
# Here we can do extra things required before releasing.
name: "[PR] Release"

on:
  pull_request:
    branches:
      - main
      - hotfix/*
    paths:
      - .release-please-manifest.json
    types: [opened, synchronize, reopened]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      # The App's push, unlike one with GITHUB_TOKEN, runs CI on the new commit.
      - uses: ecmwf/ci-infrastructure/actions/mint-token@main
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permissions: contents:write
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: "Replace migrations placeholder with next version"
        run: |
          MIGRATION_FOLDER=models/src/anemoi/models/migrations/scripts
          NEXT_MODELS_VERSION=$(jq -r '."models"' .release-please-manifest.json)

          echo "Next version: $NEXT_MODELS_VERSION"

          find $MIGRATION_FOLDER -type f -name "*.py" -print0 | while IFS= read -r -d '' file; do
            sed -i "s/%NEXT_ANEMOI_MODELS_VERSION%/$NEXT_MODELS_VERSION/g" "$file"
          done

          echo "$(git diff)"

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ecmwf-release-please[bot]"
            git config user.email "360674475+ecmwf-release-please[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: Update checkpoint migrations placeholder to $NEXT_MODELS_VERSION"
            git push
          else
            echo "Nothing to commit, migrations are up to date."
          fi
