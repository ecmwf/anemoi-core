name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "54 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_POLL_INTERVAL: ${{ vars.ARTIFACT_POLL_INTERVAL || '60' }}
  ARTIFACT_WAIT_TIMEOUT: ${{ vars.ARTIFACT_WAIT_TIMEOUT || '1800' }}
  ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
  ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  ci-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main
        with:
          check-workflows: 'true'

  resolve:
    needs: ci-approval
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ toJSON(fromJSON(steps.r.outputs.json)['test']) }}
      dispatch-plans: ${{ steps.r.outputs.dispatch-plans }}
    steps:
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          app: reader
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: anemoi-core,anemoi-datasets,anemoi-transform,anemoi-utils
          permissions: contents:read actions:read
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          matrix: test
          token: ${{ steps.mint.outputs.token }}
          rebuild-missing: 'true'
      - name: Wait for the deps of test
        if: steps.r.outputs.dispatch-plans == '[]'
        uses: ecmwf/ci-infrastructure/actions/wait-for-deps@main
        with:
          matrix: ${{ toJSON(fromJSON(steps.r.outputs.json)['test']) }}
          token: ${{ steps.mint.outputs.token }}
    name: resolve + wait-build

  rebuild-producers:
    needs: [ci-approval, resolve]
    runs-on: ubuntu-latest
    steps:
      - if: needs.resolve.outputs.dispatch-plans != '' && needs.resolve.outputs.dispatch-plans != '[]'
        uses: ecmwf/ci-infrastructure/actions/dispatch-producers@main
        with:
          dispatch-plans: ${{ needs.resolve.outputs.dispatch-plans }}
          repositories: anemoi-core,anemoi-datasets,anemoi-transform,anemoi-utils
          client-id: ${{ secrets.CI_DISPATCHER_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_DISPATCHER_APP_PRIVATE_KEY }}

  test:
    needs: [ci-approval, resolve, rebuild-producers]
    name: test (${{ matrix._resolved['job-name'] }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.test-matrix) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          app: reader
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: anemoi-core,anemoi-datasets,anemoi-transform,anemoi-utils
          permissions: contents:read actions:read
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
      - name: Fetch resolved deps
        id: deps
        uses: ecmwf/ci-infrastructure/actions/fetch-deps@main
