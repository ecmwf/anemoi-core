name: Regenerate downstream-CI workflows

on:
  push:
    branches: [main]
  # Drift also comes from sibling manifests and the generator.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: regenerate-workflows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    uses: ecmwf/ci-infrastructure/.github/workflows/regenerate-workflows.yml@main
    secrets: inherit
    with:
      add-labels: ATS Approval Not Needed,expensive-tests-not-needed
      # PR titles must follow conventional commits.
      title: "chore: Regenerate downstream-CI workflows"
