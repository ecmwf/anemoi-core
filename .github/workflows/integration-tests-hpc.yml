name: nightly-integration-tests-hpc-gpu

 # Controls when the workflow will run
on:
  schedule:
    - cron: "0 23 * * *"  # every day at 23pm on default(main) branch
  workflow_dispatch:
    inputs:
      tests:
        description: "Which expensive integration test(s) to run"
        type: choice
        default: all
        options:
          - all
          - test_benchmark
          - test_training_cycle
          - test_accuracy
  # pull_request_target, not pull_request: a fork's pull_request run gets no
  # secrets, so the HPC jobs below cannot work for outside contributors at all.
  # It runs the BASE branch's copy of this file, so a pull request editing this
  # workflow cannot test the edit -- use workflow_dispatch. Everything here runs
  # pull request code, so nothing may be added without `needs: ci-approval`.
  #
  # Every type listed is load-bearing. `synchronize` is what revokes a stale
  # approval. `unlabeled` is what lets a verdict be taken back: checks are
  # per-SHA, so without a re-run, dropping 'run-expensive-tests' would leave the
  # old red ci-approval standing on a pull request that no longer wants the
  # tests at all. It also costs one extra skipped run each time the gate revokes
  # its own label, which is cheap and terminates -- that run finds no label to
  # delete.
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

# pull_request_target would otherwise hand a read/write token to a run an outside
# contributor triggered. The two jobs needing more say so themselves; the HPC
# jobs touch no API at all.
permissions:
  contents: read

jobs:
  # The `if:` is the opt-in, ours: no 'run-expensive-tests' means nobody asked,
  # so this job skips, everything downstream skips with it, and the run is green.
  # The action answers a different question -- may a fork's code run on our HPC
  # account -- and FAILS when it may not. Never merge the two: an `if:` on the
  # approval label would report Success for "nothing ran".
  ci-approval:
    name: ci-approval
    if: ${{ github.event_name != 'pull_request_target' || contains(github.event.pull_request.labels.*.name, 'run-expensive-tests') }}
    # No checkout, no Python; the action needs bash, jq, and gh only to revoke.
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write   # only so the label can be revoked again
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main
        with:
          label: approved-for-ci

  # `needs: ci-approval` is the whole wiring; no `if:` belongs here.
  build-env:
    name: build-env
    needs: ci-approval
    runs-on: hpc
    timeout-minutes: 120
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            env | grep SLURM # helps with debugging
            set -eux
            module load python3/3.12.9-01
            # Shared working dir on $PERM. The clone + virtualenv are built once
            # here and reused by each test, then removed by the cleanup-env job.
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            REPO_NAME=anemoi-core
            # A fork's branch does not exist in ecmwf/anemoi-core, so the old
            # `clone -b $head_ref` could only ever work for insiders. Every pull
            # request does have refs/pull/N/merge here, fork or not, and it is the
            # merge with the base branch -- what a `pull_request` run would test.
            # pull_request_target leaves github.ref on the base branch, hence the
            # hand-built ref.
            PR_NUMBER='${{ github.event.pull_request.number }}'
            if [ -n "$PR_NUMBER" ]; then
              CHECKOUT_REF="refs/pull/$PR_NUMBER/merge"
            else
              CHECKOUT_REF='${{ github.ref }}'
            fi
            rm -rf "$WORKDIR"
            mkdir -p "$WORKDIR"
            cd "$WORKDIR"
            git clone --no-checkout https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/ecmwf/${REPO_NAME}.git
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            cd "$REPO_NAME"
            # The merge ref exists only while the pull request merges cleanly, so
            # a missing one means conflicts, not a CI fault.
            if ! git fetch origin "$CHECKOUT_REF"; then
              echo "Could not fetch $CHECKOUT_REF from ecmwf/$REPO_NAME."
              echo "For a pull request this almost always means it conflicts with its base branch; rebase and push again."
              exit 1
            fi
            git checkout --detach FETCH_HEAD
            git show -s --format=oneline
            pip install --no-cache-dir -e ./training[all,tests,profile] -e ./models[all,tests] -e ./graphs[all,tests]
            pip freeze
            deactivate
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_build_env
            #SBATCH --nodes=1
            #SBATCH --cpus-per-task=32
            #SBATCH --time=01:00:00
            #SBATCH --qos=nf
            #SBATCH --mem=64G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  # One job per expensive test. On workflow_dispatch a single test can be picked
  # via the 'tests' input; on every other event all three run. When build-env is
  # skipped these skip automatically as dependents -- and when ci-approval fails
  # they skip too, but the run is already red.
  test_benchmark:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_benchmark' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: srun python -m pytest -v training/tests/integration/test_benchmark.py --slow --multigpu
      timeout_minutes: 360
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_benchmark_pytest
        #SBATCH --nodes=1
        #SBATCH --ntasks-per-node=2
        #SBATCH --cpus-per-task=32
        #SBATCH --gpus-per-node=2
        #SBATCH --time=1:00:00
        #SBATCH --qos=ng
        #SBATCH --mem=120GB
    secrets: inherit

  test_training_cycle:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_training_cycle' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/ --ignore=training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_training_cycle
        #SBATCH --time=01:00:00
        #SBATCH --qos=ng
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  test_accuracy:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_accuracy' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_accuracy
        #SBATCH --time=01:00:00
        #SBATCH --qos=ng
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  cleanup-env:
    name: cleanup-env
    runs-on: hpc
    timeout-minutes: 30
    needs: [ci-approval, build-env, test_benchmark, test_training_cycle, test_accuracy]
    # Always free the shared venv from $PERM once the tests finish, whether they
    # passed or failed. Guarded on build-env so it does not fire when no env was
    # built -- an unlabeled pull request, or one ci-approval turned away.
    if: ${{ always() && needs.build-env.result != 'skipped' }}
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            set -eux
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            rm -rf "$WORKDIR"
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_cleanup_env
            #SBATCH --time=00:15:00
            #SBATCH --qos=nf
            #SBATCH --mem=8G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  notify-team:
    needs: [ci-approval, build-env, test_benchmark, test_training_cycle, test_accuracy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write   # comments on #294; no longer inherited from the repo default
    steps:
      - name: Add failure comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: 294
          body: |
            ## 🚨 Nightly Job Failed

            **Repository:** ${{ github.repository }}
            **Workflow:** ${{ github.workflow }}
            **Run URL:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${{ github.event.schedule }}

            cc: @ecmwf/anemoisecurity
