name: nightly-integration-tests-hpc-gpu

 # Controls when the workflow will run
on:
  schedule:
    - cron: "0 23 * * *"  # every day at 23pm on default(main) branch
  workflow_dispatch:
    inputs:
      tests:
        description: "Which expensive integration test(s) to run"
        type: choice
        default: all
        options:
          - all
          - test_benchmark
          - test_training_cycle
          - test_accuracy
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  merge_group:

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Determine what to run
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        name: Decide whether to run the expensive tests
        run: |
          # schedule       -> only if there was a commit in the last 24h
          # pull_request   -> only if the 'run-expensive-tests' label is set
          # dispatch/merge -> always
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$(git rev-list --after='24 hours' ${{ github.sha }} 2>/dev/null)" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'run-expensive-tests') }}" = "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - id: set_matrix
        name: Build the (optionally filtered) test matrix
        run: |
          SELECTED='${{ github.event.inputs.tests }}'
          [ -z "$SELECTED" ] && SELECTED="all"
          # Single source of truth for the three expensive tests. Newlines in
          # sbatch_options are written as \n so each #SBATCH directive stays
          # flush-left when the ci-hpc-generic action expands it.
          FULL=$(jq -n '{include: [
            {
              test_name: "test_benchmark",
              pip_extras: "all,tests,profile",
              pytest_cmd: "srun python -m pytest -v training/tests/integration/test_benchmark.py --slow --multigpu",
              timeout_minutes: 360,
              sbatch_options: "#SBATCH --job-name=anemoi_core_benchmark_pytest\n#SBATCH --nodes=1\n#SBATCH --ntasks-per-node=2\n#SBATCH --cpus-per-task=32\n#SBATCH --gpus-per-node=2\n#SBATCH --time=1:00:00\n#SBATCH --qos=ng\n#SBATCH --mem=0\n"
            },
            {
              test_name: "test_training_cycle",
              pip_extras: "all,tests",
              pytest_cmd: "python3 -m pytest -v training/tests/integration/test_training_cycle.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL",
              timeout_minutes: 120,
              sbatch_options: "#SBATCH --job-name=anemoi_core_pytest_training_cycle\n#SBATCH --time=01:00:00\n#SBATCH --qos=ng\n#SBATCH --gpus=1\n#SBATCH --gres=gpu:1\n#SBATCH --mem=64G\n"
            },
            {
              test_name: "test_accuracy",
              pip_extras: "all,tests",
              pytest_cmd: "python3 -m pytest -v training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL",
              timeout_minutes: 120,
              sbatch_options: "#SBATCH --job-name=anemoi_core_pytest_accuracy\n#SBATCH --time=01:00:00\n#SBATCH --qos=ng\n#SBATCH --gpus=1\n#SBATCH --gres=gpu:1\n#SBATCH --mem=64G\n"
            }
          ]}')
          if [ "$SELECTED" = "all" ]; then
            MATRIX="$FULL"
          else
            MATRIX=$(jq --arg sel "$SELECTED" '{include: [.include[] | select(.test_name == $sel)]}' <<< "$FULL")
          fi
          # printf (not echo) so \n inside sbatch_options is preserved verbatim.
          printf 'matrix=%s\n' "$(jq -c . <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: ${{ matrix.test_name }}
    runs-on: hpc
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: setup
    if: ${{ needs.setup.outputs.should_run != 'false' && needs.setup.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            env | grep SLURM # helps with debugging
            set -eux
            module load python3/3.12.9-01
            # Build off /dev/shm: the default $TMPDIR is RAM-backed tmpfs and counts
            # against the SLURM --mem cgroup, so installing torch + the nvidia CUDA
            # stack into it stalls. Redirect to a disk-backed per-job scratch dir.
            export TMPDIR="$SCRATCH/ci-tmp/$SLURM_JOB_ID"
            mkdir -p "$TMPDIR"
            trap 'rm -rf "$TMPDIR"' EXIT
            REPO_NAME=anemoi-core
            REPO_BRANCH=${{ github.head_ref || github.ref_name }}
            cd $TMPDIR
            git clone -b $REPO_BRANCH https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/ecmwf/${REPO_NAME}.git
            cd $REPO_NAME
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -e ./training[${{ matrix.pip_extras }}] -e ./models[all,tests] -e ./graphs[all,tests]
            # Inject the MLflow URL here (not via job-level env:, which does not
            # propagate to the sbatch job); secrets are valid inside this template.
            export MLFLOW_TEST_URL=${{ secrets.MLFLOW_TEST_URL }}
            export DATASET_ROOT_PATH=${{ secrets.DATASET_ROOT_PATH }}
            ${{ matrix.pytest_cmd }}
            deactivate
            rm -rf $REPO_NAME
          sbatch_options: ${{ matrix.sbatch_options }}
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  notify-team:
    needs: integration-tests
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Add failure comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: 294
          body: |
            ## 🚨 Nightly Job Failed

            **Repository:** ${{ github.repository }}
            **Workflow:** ${{ github.workflow }}
            **Run URL:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${{ github.event.schedule }}

            cc: @ecmwf/anemoisecurity
