name: nightly-integration-tests-hpc-gpu

 # Controls when the workflow will run
on:
  schedule:
    - cron: "0 23 * * *"  # every day at 23pm on default(main) branch
  workflow_dispatch:
    inputs:
      tests:
        description: "Which expensive integration test(s) to run"
        type: choice
        default: all
        options:
          - all
          - test_benchmark
          - test_training_cycle
          - test_accuracy
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  merge_group:

# Pushing to a PR supersedes any run still queued in Slurm; without this the old
# run keeps burning HPC time for a commit nobody will merge.
concurrency:
  group: expensive-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-env:
    name: build-env
    runs-on: hpc
    timeout-minutes: 120
    # Expensive tests run: on schedule/dispatch always; on a PR only when the author
    # opted in via 'run-expensive-tests' AND the branch lives in this repo (fork PRs
    # get no secrets and must not execute on the self-hosted HPC runner).
    # merge_group is excluded: the same commits were already tested on the PR.
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'run-expensive-tests')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            env | grep SLURM # helps with debugging
            set -eux
            module load python3/3.12.9-01
            # Shared working dir on $PERM. The clone + virtualenv are built once
            # here and reused by each test, then removed by the cleanup-env job.
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            REPO_NAME=anemoi-core
            REPO_BRANCH=${{ github.head_ref || github.ref_name }}
            rm -rf "$WORKDIR"
            mkdir -p "$WORKDIR"
            cd "$WORKDIR"
            git clone -b $REPO_BRANCH https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/ecmwf/${REPO_NAME}.git
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            cd "$REPO_NAME"
            git show -s --format=oneline
            pip install --no-cache-dir -e ./training[all,tests,profile] -e ./models[all,tests] -e ./graphs[all,tests]
            pip freeze
            deactivate
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_build_env
            #SBATCH --nodes=1
            #SBATCH --cpus-per-task=32
            #SBATCH --time=01:00:00
            #SBATCH --qos=nf
            #SBATCH --mem=64G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  # One job per expensive test. On workflow_dispatch a single test can be picked
  # via the 'tests' input; on every other event all three run. When build-env is
  # skipped (unlabeled PR) these skip automatically as dependents.
  test_benchmark:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_benchmark' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: srun python -m pytest -v training/tests/integration/test_benchmark.py --slow --multigpu
      timeout_minutes: 360
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_benchmark_pytest
        #SBATCH --nodes=1
        #SBATCH --ntasks-per-node=2
        #SBATCH --cpus-per-task=32
        #SBATCH --gpus-per-node=2
        #SBATCH --time=1:00:00
        #SBATCH --qos=ng
        #SBATCH --mem=120GB
    secrets: inherit

  test_training_cycle:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_training_cycle' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/test_training_cycle.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_training_cycle
        #SBATCH --time=01:00:00
        #SBATCH --qos=ng
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  test_accuracy:
    needs: build-env
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_accuracy' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_accuracy
        #SBATCH --time=01:00:00
        #SBATCH --qos=ng
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  cleanup-env:
    name: cleanup-env
    runs-on: hpc
    timeout-minutes: 30
    needs: [build-env, test_benchmark, test_training_cycle, test_accuracy]
    # Always free the shared venv from $PERM once the tests finish, whether they
    # passed or failed. Guarded on build-env so it does not fire when no env was
    # built (e.g. an unlabeled PR that skipped build-env).
    if: ${{ always() && needs.build-env.result != 'skipped' }}
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            set -eux
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            rm -rf "$WORKDIR"
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_cleanup_env
            #SBATCH --time=00:15:00
            #SBATCH --qos=nf
            #SBATCH --mem=8G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  notify-team:
    needs: [build-env, test_benchmark, test_training_cycle, test_accuracy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Add failure comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: 294
          body: |
            ## 🚨 Nightly Job Failed

            **Repository:** ${{ github.repository }}
            **Workflow:** ${{ github.workflow }}
            **Run URL:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${{ github.event.schedule }}

            cc: @ecmwf/anemoisecurity

  # Single stable check-run name that can be marked as a required status check.
  # Deliberately NOT a `uses:` job: those render as 'test_benchmark / run' when they
  # run but as bare 'test_benchmark' when skipped, so no context string works in both
  # states. 'build-env' is in `needs` because a failing build-env would otherwise skip
  # the three test jobs, and a skipped job reports Success.
  expensive-tests:
    name: expensive-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-env, test_benchmark, test_training_cycle, test_accuracy]
    if: ${{ always() }}
    steps:
      - name: Summarise expensive-test results
        env:
          # Escape hatch: an HPC/Slurm outage or a known-flaky test can be unblocked by
          # swapping the label, without needing an admin override.
          OPT_OUT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'expensive-tests-not-needed') }}
          BUILD_ENV: ${{ needs.build-env.result }}
          BENCHMARK: ${{ needs.test_benchmark.result }}
          TRAINING_CYCLE: ${{ needs.test_training_cycle.result }}
          ACCURACY: ${{ needs.test_accuracy.result }}
        run: |
          set -eu
          echo "build-env=$BUILD_ENV benchmark=$BENCHMARK training_cycle=$TRAINING_CYCLE accuracy=$ACCURACY"
          if [ "$OPT_OUT" = "true" ]; then
            echo "'expensive-tests-not-needed' is set - not gating on results."
            exit 0
          fi
          rc=0
          for r in "$BUILD_ENV" "$BENCHMARK" "$TRAINING_CYCLE" "$ACCURACY"; do
            case "$r" in
              success|skipped) ;;
              *) rc=1 ;;
            esac
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Expensive integration tests did not pass. See the job list for this run."
          fi
          exit $rc
