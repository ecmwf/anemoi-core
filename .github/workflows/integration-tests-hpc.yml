name: nightly-integration-tests-hpc-gpu

 # Controls when the workflow will run
on:
  schedule:
    - cron: "0 23 * * *"  # every day at 23pm on default(main) branch
  workflow_dispatch:
    inputs:
      tests:
        description: "Which expensive integration test(s) to run"
        type: choice
        default: all
        options:
          - all
          - test_benchmark
          - test_training_cycle
          - test_accuracy
  # Split by event, so each trigger does one thing:
  #  - pull_request `synchronize`: pushes. Same-repo pull requests have secrets
  #    here, so nothing changes for them, and they run their OWN copy of this
  #    file, so an edit to it is tested by the push that makes it. A fork's push
  #    never runs the tests: its token cannot read secrets, and the gate fails
  #    it anyway (new commits need a fresh approval).
  #  - pull_request_target `labeled`: adding 'run-expensive-tests'. The only way
  #    a fork's code reaches the HPC, since only this event has secrets for a
  #    fork. It runs the BASE branch's copy of this file.
  # Everything here runs pull request code, so nothing may be added without
  # `needs: ci-approval` (the check-ci-approval pre-commit hook enforces that).
  # `opened` would double-run a pull request opened with the label (that fires
  # `labeled` too); without `reopened` and `unlabeled`, the checks of the last
  # run simply stand until the next push or label.
  pull_request:
    types: [synchronize]
  pull_request_target:
    types: [labeled]
  merge_group:

# pull_request_target would otherwise hand a read/write token to a run an outside
# contributor triggered. The two jobs needing more say so themselves.
permissions:
  contents: read

jobs:
  # Two questions, answered in two places, and neither ever looks at the other's
  # label:
  #  - Are the tests WANTED? Ours, the `if:` below, and only 'run-expensive-tests'
  #    counts. No means this job skips, everything downstream skips with it, and
  #    the run is green. Other labels being added never re-run the tests.
  #  - May this code RUN on our HPC account? The action's, and only
  #    'approved-for-ci' counts. It FAILS when the answer is no -- an `if:` on the
  #    approval label would report Success for "nothing ran" -- and it spends the
  #    label, so one approval buys one run.
  #
  # So 'approved-for-ci' starts nothing by itself. On a fork, a maintainer
  # reads the diff, applies 'approved-for-ci', then applies 'run-expensive-tests'
  # (or removes and re-adds it if it is already there). Both at once also works.
  # Never leave the approval sitting alone: nothing revokes it before it is
  # spent -- a fork's push runs with a read-only token, so the gate can fail
  # that run but cannot delete the label.
  ci-approval:
    name: ci-approval
    if: >-
      ${{
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.label.name == 'run-expensive-tests'
        ) ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'run-expensive-tests')
        )
      }}
    # No checkout, no Python; the action needs bash, jq, and gh only to revoke.
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write   # only so the label can be revoked again
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main
        with:
          label: approved-for-ci

  # `needs: ci-approval` is the whole wiring; no `if:` belongs here.
  build-env:
    name: build-env
    needs: ci-approval
    runs-on: hpc
    timeout-minutes: 120
    steps:
      # The source is checked out on the runner and shipped to the cluster, so
      # the HPC job needs no clone and no GitHub token.
      #
      # Pinned to the head commit in the event rather than a pull request ref:
      # a ref is read when this step runs, which may be long after the label was
      # applied, and a fork could push in between. The gate approved the commit
      # in the event, so that is the commit that runs. Outside pull requests the
      # sha is empty and the action checks out the run's own commit.
      #
      # allow-unsafe-pr-checkout: fork code in a trusted context, payable only
      # because this job hangs off ci-approval.
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: anemoi-core
          fetch-depth: 0   # setuptools-scm derives the package versions from tags
          persist-credentials: 'false'
          allow-unsafe-pr-checkout: 'true'

      # Starts from an empty directory, as the old `rm -rf` in the HPC script
      # did: a re-run reuses the run id, and cleanup-env may have failed.
      - uses: ecmwf/ci-infrastructure/actions/remove-hpc-tree@main
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_INTEGRATION_USER }}
          remote-dir: $PERM/TESTING/integration-venvs/${{ github.run_id }}

      # Shared working dir on $PERM, reused by each test job and removed by
      # cleanup-env. The spec is expanded on the cluster, not here.
      - uses: ecmwf/ci-infrastructure/actions/push-hpc-tree@main
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_INTEGRATION_USER }}
          local-dir: ${{ github.workspace }}/anemoi-core
          remote-dir: $PERM/TESTING/integration-venvs/${{ github.run_id }}/anemoi-core

      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            env | grep SLURM # helps with debugging
            set -eux
            module load python3/3.12.9-01
            # The virtualenv is built once here, next to the source the step
            # above pushed, and reused by each test.
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            cd "$WORKDIR"
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            cd anemoi-core
            git show -s --format=oneline
            pip install --no-cache-dir -e ./training[all,tests,profile] -e ./models[all,tests] -e ./graphs[all,tests]
            pip freeze
            deactivate
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_build_env
            #SBATCH --nodes=1
            #SBATCH --cpus-per-task=32
            #SBATCH --time=00:30:00
            #SBATCH --qos=nf
            #SBATCH --mem=64G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  # One job per expensive test. On workflow_dispatch a single test can be picked
  # via the 'tests' input; on every other event all three run. When build-env is
  # skipped these skip automatically as dependents -- and when ci-approval fails
  # they skip too, but the run is already red. ci-approval is listed directly,
  # not just reached through build-env: check-ci-approval wants every job to name
  # the gate, so an edge later moved in the wrong place cannot ungate one.
  test_benchmark:
    needs: [ci-approval, build-env]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_benchmark' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: srun python -m pytest -o tmp_path_retention_policy=all -v training/tests/integration/test_benchmark.py --slow --multigpu
      timeout_minutes: 360
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_benchmark_pytest
        #SBATCH --nodes=1
        #SBATCH --ntasks-per-node=2
        #SBATCH --cpus-per-task=32
        #SBATCH --gpus-per-node=2
        #SBATCH --time=1:00:00
        #SBATCH --qos=ng
        #SBATCH --mem=120GB
    secrets: inherit

  test_training_cycle:
    needs: [ci-approval, build-env]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_training_cycle' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/ --ignore=training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_training_cycle
        #SBATCH --time=01:00:00
        #SBATCH --qos=ng
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  test_accuracy:
    needs: [ci-approval, build-env]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tests == 'all' || github.event.inputs.tests == 'test_accuracy' }}
    uses: ./.github/workflows/run-integration-test-hpc.yml
    with:
      pytest_cmd: python3 -m pytest -v training/tests/integration/test_accuracy.py --slow --mlflow --mlflow-server=$MLFLOW_TEST_URL
      timeout_minutes: 120
      sbatch_options: |
        #SBATCH --job-name=anemoi_core_pytest_accuracy
        #SBATCH --time=00:30:00
        #SBATCH --qos=dg
        #SBATCH --gpus=1
        #SBATCH --gres=gpu:1
        #SBATCH --mem=64G
    secrets: inherit

  cleanup-env:
    name: cleanup-env
    runs-on: hpc
    timeout-minutes: 30
    needs: [ci-approval, build-env, test_benchmark, test_training_cycle, test_accuracy]
    # Always free the shared venv from $PERM once the tests finish, whether they
    # passed or failed. Guarded on build-env so it does not fire when no env was
    # built -- an unlabeled pull request, or one ci-approval turned away.
    if: ${{ always() && needs.build-env.result != 'skipped' }}
    steps:
      - uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          template: |
            set -eux
            WORKDIR="$PERM/TESTING/integration-venvs/${{ github.run_id }}"
            rm -rf "$WORKDIR"
          sbatch_options: |
            #SBATCH --job-name=anemoi_core_cleanup_env
            #SBATCH --time=00:15:00
            #SBATCH --qos=nf
            #SBATCH --mem=8G
          troika_user: ${{ secrets.HPC_CI_INTEGRATION_USER }}

  notify-team:
    needs: [ci-approval, build-env, test_benchmark, test_training_cycle, test_accuracy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write   # comments on #294; no longer inherited from the repo default
    steps:
      - name: Add failure comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: 294
          body: |
            ## Nightly Job Failed

            **Repository:** ${{ github.repository }}
            **Workflow:** ${{ github.workflow }}
            **Run URL:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time:** ${{ github.event.schedule }}

            cc: @ecmwf/anemoisecurity
