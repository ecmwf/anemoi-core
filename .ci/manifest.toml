[package]
name = "anemoi-core"
repo = "ecmwf/anemoi-core"
visibility = "public"
compiler-inputs = []
# An umbrella: `package = "anemoi-core"` stands for the three packages below.
# Consumers may instead name the ones they use.
meta = true

[[deps]]
package = ["anemoi-graphs", "anemoi-models", "anemoi-training"]

[packages.anemoi-graphs]
compiler-inputs = []
deps = [
  { repo = "ecmwf/anemoi-utils", package = "anemoi-utils", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
  { repo = "ecmwf/anemoi-datasets", package = "anemoi-datasets", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
]

[packages.anemoi-models]
compiler-inputs = []
deps = [
  { package = "anemoi-graphs" },
  { repo = "ecmwf/anemoi-utils", package = "anemoi-utils", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
  { repo = "ecmwf/anemoi-transform", package = "anemoi-transform", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
]

[packages.anemoi-training]
compiler-inputs = []
deps = [
  { package = ["anemoi-graphs", "anemoi-models"] },
  { repo = "ecmwf/anemoi-utils", package = "anemoi-utils", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
  { repo = "ecmwf/anemoi-transform", package = "anemoi-transform", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
  { repo = "ecmwf/anemoi-datasets", package = "anemoi-datasets", ref = "main", compiler-inputs = [], python-version-input = "python-version" },
]

# Each leg builds, installs and tests the three packages together, and publishes
# a wheel of each, so a consumer's leg takes the ones tested on its own Python
# (python-version-input).
[matrix.test]
triggers = ["upstream-change", "rebuild-request"]
packages = ["anemoi-graphs", "anemoi-models", "anemoi-training"]

[matrix.test.defaults]
job-script = "./.ci/test.sh.j2"
runs-on = "arc-runner-normal"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest"
platform = "ubuntu-24.04"
extras = "all,tests"

[[matrix.test.include]]
python-version = "3.11"
torch-version = "2.6.*"

[[matrix.test.include]]
python-version = "3.12"
torch-version = "2.8.*"

[[matrix.test.include]]
python-version = "3.13"
torch-version = "2.*"
