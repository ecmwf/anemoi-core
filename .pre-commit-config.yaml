# This file is synced from https://github.com/ecmwf/reusable-workflows/tree/main/sync-files
# Tool configuration (line length, rules, ...) belongs into pyproject.toml, not into hook args.
repos:
- repo: local
  hooks:
  - id: clear-notebooks-output
    name: clear-notebooks-output
    files: tools/.*\.ipynb$
    stages: [pre-commit]
    language: python
    entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
    additional_dependencies: [nbconvert]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    args: [--unsafe, --allow-multiple-documents]
  - id: check-toml
  - id: check-case-conflict
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: no-commit-to-branch
  - id: check-added-large-files
  - id: check-merge-conflict
- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
  - id: python-use-type-annotations
  - id: python-check-blanket-noqa
  - id: python-no-log-warn
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format # after ruff-check, whose fixes may need reformatting
- repo: https://github.com/sphinx-contrib/sphinx-lint
  rev: v1.0.2
  hooks:
  - id: sphinx-lint
- repo: https://github.com/b8raoult/pre-commit-docconvert
  rev: "0.1.5"
  hooks:
  - id: docconvert
    args: ["numpy"]
- repo: https://github.com/b8raoult/pre-commit-copyright-notice
  rev: "0.3.0"
  hooks:
  - id: copyright-notice
    args:
    - --exclude=docs/**/*.py
    - --fix
    - --exit-non-zero-on-fix
    - --holder
    - Anemoi contributors
    - --license
    - tools/pre-commit-copyright-notice.txt
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: "v2.29.4"
  hooks:
  - id: pyproject-fmt
- repo: https://github.com/jshwi/docsig # Check docstrings against function sig
  rev: v0.96.0
  hooks:
  - id: docsig
ci:
  autoupdate_schedule: quarterly # updates come from dependabot in reusable-workflows
  autoupdate_commit_msg: "chore(deps): pre-commit.ci autoupdate"
